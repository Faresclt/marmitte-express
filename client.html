<script>
/* Brand pre-boot — voir index.html pour la justification.
   Variante client : cibles #resto-logo (img). */
(function(){
  try {
    function read(k){
      var v = localStorage.getItem(k);
      if (v == null) return null;
      if (v.length >= 2 && v.charAt(0) === '"' && v.charAt(v.length-1) === '"') {
        try { return JSON.parse(v); } catch(e){}
      }
      return v;
    }
    var lu = read('brand_logoUrl');
    var ln = read('brand_name');
    var la = read('brand_accent');
    // Cache local = donnée Firestore : couleur #hex et URL https/data:image/relative seulement
    if (la && !/^#[0-9a-f]{3,8}$/i.test(la)) la = null;
    if (lu && !/^(https:\/\/|data:image\/(png|jpe?g|webp|gif|avif);base64,|(\.{0,2}\/)?[a-z0-9_-][^:]*$)/i.test(lu)) lu = null;
    if (la) document.documentElement.style.setProperty('--accent', la);
    if (lu || ln) {
      window.__brandPreBoot = { logoUrl: lu, name: ln, accent: la };
    }
  } catch(e){}
})();
</script>

<script type="module">
import { db, doc, onSnapshot, getDoc, escHtml, safeUrl, safeColor, optImg } from './assets/js/firebase-sync.js';

// Carte seule (décision du 19/11) : le client consulte la carte via le QR de
// table, il ne commande plus — les serveuses prennent la commande (serveur.html).
// Aucune écriture Firestore depuis cette page.

// Numéro de table (optionnel) : client.html?table=3
// Valeur d'URL = donnée non fiable : string bornée, affichée via textContent.
const params = new URLSearchParams(window.location.search);
const tableNum = String(params.get('table') || '').trim().slice(0, 20);

let menu = null;

// ── Prix (lecture seule) ──
const SIROP_PRICE = 0.5;
// Variantes de taille : tableau [{label, price}] (format caisse) ; tolère aussi
// l'ancienne forme texte « 6 pièces:12|12 pièces:18 ».
function variantsOf(p){
  if(!p || !p.hasVariant) return [];
  let raw = p.variants;
  if(typeof raw === 'string'){
    raw = raw.split('|').map(s => {
      const i = s.lastIndexOf(':');
      return i > 0 ? { label: s.slice(0, i).trim(), price: s.slice(i + 1).trim().replace(',', '.') } : null;
    });
  }
  return Array.isArray(raw)
    ? raw.filter(v => v && typeof v.label === 'string' && v.label && Number.isFinite(Number(v.price)))
    : [];
}
// « 6 pièces 12,00 € · 12 pièces 18,00 € » (texte brut, à échapper à l'affichage)
function variantsText(p){
  return variantsOf(p).map(v => v.label + ' ' + fmtEur(v.price) + ' €').join(' · ');
}
// Prix affiché sur la carte : prix de base, ou « dès » la plus petite variante
function priceLabel(p){
  const vs = variantsOf(p);
  if(vs.length){
    const min = Math.min(...vs.map(v => Number(v.price) || 0));
    return 'dès ' + min.toFixed(2).replace('.',',') + ' €';
  }
  return (Number(p.price) || 0).toFixed(2).replace('.',',') + ' €';
}
function fmtEur(n){ return (Number(n) || 0).toFixed(2).replace('.',','); }
let productImages = {}; // {productId: base64_thumbnail}
let activeFilters = new Set(); // tags actifs : 'vegan', 'glutenFree', 'spicy', 'vegetarian'
let searchQuery = '';

// ── Allergies du client (persistées par device pour les visites suivantes) ──
// Liste officielle INCO 2014 (Annexe II Règlement UE 1169/2011)
const ALLERGENS_LIST = ['Céréales contenant du gluten','Crustacés','Œufs','Poissons','Arachides','Soja','Lait','Fruits à coque','Céleri','Moutarde','Graines de sésame','Sulfites','Lupin','Mollusques'];
let myAllergies = new Set();
try {
  const stored = localStorage.getItem('client_allergies');
  if(stored) myAllergies = new Set(JSON.parse(stored));
} catch(e){ /* ignore corrupt storage */ }

// Numéro de table affiché seulement s'il est présent dans l'URL
if(tableNum){
  document.getElementById('table-display').textContent = tableNum;
  document.getElementById('table-pill').style.display = '';
  document.title = `Table ${tableNum} — La carte`;
}

// Fix #10 : batches d'images chargés en parallèle (Promise.all) au lieu d'await
// séquentiel. Sur 5 batches × 800ms en 4G restaurant ça passe de 4s à ~1s.
async function loadImages(batchCount){
  const tasks = [];
  for(let i=0; i<batchCount; i++){
    tasks.push(
      getDoc(doc(db, 'config', 'images_'+i))
        .then(snap => {
          if(snap.exists()){
            const data = snap.data();
            if(data.images) Object.assign(productImages, data.images);
          }
        })
        .catch(e => console.warn('Image batch '+i+' load error:', e))
    );
  }
  await Promise.all(tasks);
  renderMenu();
}

// Load menu
onSnapshot(doc(db, 'config', 'menu'), snap => {
  if(snap.exists()){
    menu = snap.data();
    // Apply branding (le cache localStorage a déjà été appliqué par brand-boot.js)
    const b = menu.branding||{};
    if(b.name) { const safe = escHtml(b.name); document.getElementById('resto-name').innerHTML = safe.replace(/(\S+)$/, '<span style="color:var(--accent)">$1</span>'); }
    const accent = safeColor(b.accent);
    if(accent) document.documentElement.style.setProperty('--accent', accent);
    const logoImg = document.getElementById('resto-logo');
    if(logoImg){
      const logo = safeUrl(b.logoUrl);
      if(logo){
        if(logoImg.getAttribute('src') !== logo) logoImg.src = logo;
        logoImg.style.display = 'block';
      } else { logoImg.style.display = 'none'; }
    }
    // Persiste en cache pour la prochaine visite (élimine le FOUC)
    window.BrandCache?.save(b);
    renderMenu();
    updateAllergiesChip();
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';
    // Load images if available
    if(menu.imageBatches && menu.imageBatches > 0){
      loadImages(menu.imageBatches);
    }
  } else {
    document.getElementById('loading').innerHTML='<div style="text-align:center;padding:40px"><div style="font-size:48px">⚠️</div><div style="color:#888;margin-top:12px">Carte non disponible.<br>Appelez un serveur.</div></div>';
  }
});

function matchesFilters(p){
  // Filtre allergies : si le client a déclaré une allergie X, on masque les plats contenant X
  if(myAllergies.size > 0 && Array.isArray(p.allergens)){
    for(const a of p.allergens){
      if(myAllergies.has(a)) return false;
    }
  }
  if(activeFilters.size === 0) return true;
  for(const f of activeFilters){
    if(f === 'vegan' && !p.vegan) return false;
    if(f === 'vegetarian' && !p.vegetarian && !p.vegan) return false;
    if(f === 'glutenFree' && !p.glutenFree) return false;
    if(f === 'spicy' && !p.spicy) return false;
  }
  return true;
}

function matchesSearch(p){
  if(!searchQuery) return true;
  const q = searchQuery.toLowerCase().trim();
  if(!q) return true;
  const haystack = [p.name, p.sub, p.description].filter(Boolean).join(' ').toLowerCase();
  return haystack.includes(q);
}

function renderMenu(){
  if(!menu) return;
  const tabs = document.getElementById('menu-tabs');
  const content = document.getElementById('menu-content');
  const cats = menu.cats||[];
  if(!cats.length) return;

  let activeCat = tabs.dataset.active || String(cats[0]?.id ?? '');
  // Catégories venant de Firestore : tout échappé, plus d'onclick construit
  // avec c.id → data-cat + délégation (listener sur #menu-tabs plus bas).
  tabs.innerHTML = cats.map(c=>{
    const cid = String(c.id ?? '');
    const on = activeCat === cid;
    return `
    <button class="mtab${on?' active':''}" data-cat="${escHtml(cid)}" aria-pressed="${on}">
      ${escHtml(c.icon||'')} ${escHtml(c.name||'')}
    </button>`;
  }).join('');
  tabs.dataset.active = activeCat;

  // Filtre catégorie + tags + recherche
  const prods = (menu.products||[]).filter(p=>String(p.cat ?? '')===activeCat && matchesFilters(p) && matchesSearch(p));
  const sections = [];
  prods.forEach(p=>{
    const sec = p.section||'';
    let s = sections.find(x=>x.name===sec);
    if(!s){ s={name:sec,items:[]}; sections.push(s); }
    s.items.push(p);
  });

  let html='';
  sections.forEach(sec=>{
    if(sec.name) html+=`<div class="sec-sep">${escHtml(sec.name.toUpperCase())}</div>`;
    sec.items.forEach(p=>{
      const img = safeUrl(optImg(p.imgUrl || productImages[p.id] || null, 'thumb'));
      // src filtré par safeUrl (https, data:image raster, relatif) puis échappé ;
      // alt échappé pour bloquer toute injection via le nom de produit.
      const imgHtml = img
        ? `<div class="prod-img"><img src="${escHtml(img)}" alt="${escHtml(p.name)}" loading="lazy" decoding="async" width="64" height="64"></div>`
        : '';
      // Stock : 0 = épuisé ; tout le reste (-1 / undefined / N) = disponible
      const outOfStock = p.stock === 0;
      // Pastille allergènes (visible AVANT clic = conformité INCO 2014 art. 9)
      const allergens = Array.isArray(p.allergens) ? p.allergens : [];
      const allergenHint = allergens.length ? `<div class="prod-allergens-hint">⚠️ Allergènes (${allergens.length})</div>` : '';
      const displaySub = /^\s*ex\s*:/i.test(p.sub || '') ? '' : p.sub;   // « Ex : … » = texte d'exemple, jamais affiché
      const vText = variantsText(p);
      const optHint = [p.hasCuisson?'🔥 Cuisson au choix':'', p.hasGarniture?'🍟 Garniture au choix':''].filter(Boolean).join(' · ');
      html+=`<div class="prod-card${img?' has-img':''}${outOfStock?' sold-out':''}" data-pid="${escHtml(p.id)}" data-action="detail">
        ${imgHtml}
        <div class="prod-info">
          <div class="prod-name">${p.pdj?'⭐ ':''}${escHtml(p.name)}</div>
          ${displaySub?`<div class="prod-sub">${escHtml(displaySub)}</div>`:''}
          ${vText?`<div class="prod-variants">📏 ${escHtml(vText)}</div>`:''}
          ${optHint?`<div style="font-size:11px;color:var(--accent);font-weight:600;margin-top:2px">${optHint}</div>`:''}
          ${allergenHint}
          <div class="prod-price">${priceLabel(p)}</div>
        </div>
        ${outOfStock ? `<div class="prod-actions"><span class="badge-soldout">Épuisé</span></div>` : ''}
      </div>`;
    });
  });
  const pdjHtml = renderPdjBanner();
  if(!html){
    const reason = (activeFilters.size > 0 || searchQuery)
      ? 'Aucun plat ne correspond à vos filtres.<br><button onclick="clearFilters()" class="btn btn-ghost btn-sm" style="margin-top:12px">Réinitialiser les filtres</button>'
      : 'Aucun article dans cette catégorie';
    content.innerHTML = pdjHtml + `<div style="padding:40px 20px;text-align:center;color:var(--muted)"><div style="font-size:40px;margin-bottom:12px">🍽️</div>${reason}</div>`;
  } else {
    content.innerHTML = pdjHtml + html + '<div class="menu-footnote">Prix TTC, TVA incluse — service compris</div>';
  }
}

// Bandeau « ⭐ Plat du jour » en tête de la carte, sur tous les onglets.
// Affichage seul : le nom du jour est le sous-titre (p.sub) saisi par la
// patronne, jamais le texte d'exemple « Ex : … ». Masqué pendant une recherche
// texte, et soumis aux mêmes filtres que la liste (allergies déclarées,
// Végé/Vegan…) pour ne jamais mettre en avant un plat que le client a exclu.
// Toucher le bandeau ouvre la fiche via la délégation data-action="detail".
function renderPdjBanner(){
  if(String(searchQuery || '').trim()) return '';
  const p = (menu.products||[]).find(x => {
    if(!x || x.pdj !== true || x.active === false) return false;
    const sub = String(x.sub ?? '').trim();
    return !!sub && !/^\s*ex\s*:/i.test(sub) && matchesFilters(x);
  });
  if(!p) return '';
  const name = String(p.sub ?? '').trim();
  const img = safeUrl(optImg(p.imgUrl || productImages[p.id] || null, 'thumb'));
  const outOfStock = p.stock === 0;
  return `<div class="pdj-wrap">
    <button type="button" class="pdj-banner${outOfStock?' sold-out':''}" data-action="detail" data-pid="${escHtml(p.id)}">
      ${img ? `<span class="prod-img"><img src="${escHtml(img)}" alt="" decoding="async" width="64" height="64"></span>` : ''}
      <span class="pdj-info">
        <span class="pdj-label">⭐ Plat du jour</span>
        <span class="pdj-name">${escHtml(name)}</span>
        <span class="pdj-price">${escHtml(priceLabel(p))}${outOfStock ? ' <span class="pdj-soldout">· Épuisé</span>' : ''}</span>
      </span>
    </button>
  </div>`;
}

// Event delegation : clic sur une carte produit → fiche détaillée
document.getElementById('menu-content').addEventListener('click', (e) => {
  const target = e.target.closest('[data-action="detail"]');
  if(!target) return;
  const pid = target.dataset.pid;
  if(!(menu?.products||[]).some(x => x.id === pid)) return;
  openProductDetail(pid);
});
document.getElementById('menu-tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cat]');
  if(b) switchTab(b.dataset.cat);
});

function clearFilters(){
  activeFilters.clear();
  searchQuery = '';
  document.querySelectorAll('#filter-bar .chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  const sb = document.getElementById('search-input');
  if(sb) sb.value = '';
  renderMenu();
}

function toggleFilter(tag, btn){
  if(activeFilters.has(tag)){
    activeFilters.delete(tag);
    btn.setAttribute('aria-pressed', 'false');
  } else {
    activeFilters.add(tag);
    btn.setAttribute('aria-pressed', 'true');
  }
  renderMenu();
}

function onSearch(value){
  searchQuery = value;
  renderMenu();
}

window.clearFilters = clearFilters;
window.toggleFilter = toggleFilter;
window.onSearch = onSearch;

// ── Fix #6 : Escape ferme le modal du dessus (a11y / mobile-friendly) ──
// L'ordre suit le z-index : allergies > detail.
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  const allergiesModal = document.getElementById('allergies-modal');
  const detailModal = document.getElementById('detail-modal');
  if(allergiesModal && allergiesModal.style.display === 'flex'){ closeAllergiesModal(); return; }
  if(detailModal && detailModal.classList.contains('show')){ closeDetail(); return; }
});

// ── Modal "Mes allergies" ──
function openAllergiesModal(){
  const html = `
    <h3 style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin:0 0 6px">🚫 Mes allergies</h3>
    <p style="font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 14px">Cochez vos allergies alimentaires. Les plats qui en contiennent seront automatiquement masqués.</p>
    <div id="allergies-checkboxes" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:16px">
      ${ALLERGENS_LIST.map(a => `
        <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1.5px solid ${myAllergies.has(a)?'var(--accent)':'var(--border)'};border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s">
          <input type="checkbox" value="${escHtml(a)}" ${myAllergies.has(a)?'checked':''} style="margin:0;accent-color:var(--accent)">
          <span>${escHtml(a)}</span>
        </label>
      `).join('')}
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="clearAllergies()" style="flex:1;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer">Tout décocher</button>
      <button onclick="saveAllergies()" style="flex:2;height:44px;border-radius:12px;background:var(--accent);border:none;color:#000;font-weight:800;font-size:14px;cursor:pointer">✓ Appliquer</button>
    </div>
  `;
  document.getElementById('allergies-modal-body').innerHTML = html;
  document.getElementById('allergies-modal').style.display = 'flex';
}

function closeAllergiesModal(){
  document.getElementById('allergies-modal').style.display = 'none';
}

function saveAllergies(){
  const checked = Array.from(document.querySelectorAll('#allergies-checkboxes input[type=checkbox]:checked')).map(c => c.value);
  myAllergies = new Set(checked);
  try { localStorage.setItem('client_allergies', JSON.stringify(checked)); } catch(e){}
  updateAllergiesChip();
  closeAllergiesModal();
  renderMenu();
  if(checked.length > 0) showToast('🛡️ '+checked.length+' allergie(s) actives');
}

function clearAllergies(){
  document.querySelectorAll('#allergies-checkboxes input[type=checkbox]').forEach(c => c.checked = false);
  // Reset visuel des labels
  document.querySelectorAll('#allergies-checkboxes label').forEach(l => l.style.borderColor = 'var(--border)');
}

function updateAllergiesChip(){
  const el = document.getElementById('allergies-chip-text');
  if(!el) return;
  const chip = el.closest('.chip');
  if(myAllergies.size > 0){
    el.textContent = '🚫 Mes allergies ('+myAllergies.size+')';
    chip?.setAttribute('aria-pressed', 'true');
  } else {
    el.textContent = '🚫 Mes allergies';
    chip?.setAttribute('aria-pressed', 'false');
  }
}

window.openAllergiesModal = openAllergiesModal;
window.closeAllergiesModal = closeAllergiesModal;
window.saveAllergies = saveAllergies;
window.clearAllergies = clearAllergies;

// Petit toast de feedback (ex. allergies appliquées)
let _toastTimer = null;
function showToast(msg){
  let t = document.getElementById('client-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'client-toast';
    t.setAttribute('role', 'status');
    t.setAttribute('aria-live', 'polite');
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

// ── Product detail modal (clic plat depuis menu client) ──
window.openProductDetail = function(pid){
  const p = (menu.products||[]).find(x=>x.id===pid);
  if(!p) return;
  // Image
  const img = safeUrl(optImg(p.imgUrl || productImages[p.id] || null, 'full'));
  const imgEl = document.getElementById('detail-img');
  const phEl = document.getElementById('detail-img-ph');
  if(img){ imgEl.src = img; imgEl.style.display='block'; phEl.style.display='none'; }
  else { imgEl.style.display='none'; phEl.style.display='flex'; }
  // Nom + prix
  document.getElementById('detail-name').innerHTML = (p.pdj?'⭐ ':'') + escHtml(p.name);
  document.getElementById('detail-price').textContent = priceLabel(p);
  // Description
  const desc = p.description || (/^\s*ex\s*:/i.test(p.sub || '') ? '' : p.sub) || '';
  document.getElementById('detail-desc').textContent = desc || 'Aucune description disponible.';
  // Tailles (prix par variante) + supplément sirop : lecture seule
  const vText = variantsText(p);
  const sizeLines = [vText, p.hasSirop ? 'Supplément sirop +' + fmtEur(SIROP_PRICE) + ' €' : ''].filter(Boolean);
  document.getElementById('detail-variants-sec').style.display = sizeLines.length ? 'block' : 'none';
  document.getElementById('detail-variants').textContent = sizeLines.join('\n');
  // Tags
  const tags = [];
  if(p.stock === 0) tags.push('<span class="detail-tag spicy">Épuisé</span>');
  if(p.vegan) tags.push('<span class="detail-tag vegan">🌱 Vegan</span>');
  else if(p.vegetarian) tags.push('<span class="detail-tag veg">🥬 Végétarien</span>');
  if(p.glutenFree) tags.push('<span class="detail-tag veg" style="background:rgba(74,158,255,.15);color:#4a9eff;border-color:rgba(74,158,255,.3)">🌾 Sans gluten</span>');
  if(p.spicy) tags.push('<span class="detail-tag spicy">🌶️ Épicé</span>');
  if(p.alcohol) tags.push('<span class="detail-tag allergen">🍺 Alcool</span>');
  if(p.cat==='boissons') tags.push('<span class="detail-tag" style="background:rgba(74,158,255,.15);color:#4a9eff;border:1px solid rgba(74,158,255,.3)">🥤 Boisson</span>');
  document.getElementById('detail-tags').innerHTML = tags.join('');
  // Garniture
  const garn = p.garniture || (p.hasGarniture ? 'Au choix : pommes de terre sautées, salade, pâtes ou frites maison' : '');
  document.getElementById('detail-garniture-sec').style.display = garn ? 'block' : 'none';
  document.getElementById('detail-garniture').textContent = garn;
  // Sauces / accompagnement
  const sauces = p.sauces || p.accompagnement || '';
  document.getElementById('detail-sauces-sec').style.display = sauces ? 'block' : 'none';
  document.getElementById('detail-sauces').textContent = sauces;
  // Allergènes
  const allergens = Array.isArray(p.allergens) ? p.allergens : (p.allergens ? String(p.allergens).split(',').map(s=>s.trim()).filter(Boolean) : []);
  document.getElementById('detail-allergens-sec').style.display = allergens.length ? 'block' : 'none';
  document.getElementById('detail-allergens').innerHTML = allergens.map(a => `<span class="detail-tag allergen">${escHtml(a)}</span>`).join('');
  // Show modal
  document.getElementById('detail-modal').classList.add('show');
};

window.closeDetail = function(){
  document.getElementById('detail-modal').classList.remove('show');
};

function switchTab(id){
  const tabs=document.getElementById('menu-tabs');
  tabs.dataset.active=id;
  renderMenu();
}
window.switchTab=switchTab;
</script>

<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}

/* Header */
#app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.table-pill{background:var(--accent);color:#000;font-family:'Bebas Neue',sans-serif;font-size:18px;padding:4px 14px;border-radius:20px;letter-spacing:1px}
#resto-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px}
.tagline{font-size:11px;color:var(--muted);font-weight:700}

/* Main app — #app défile en entier : recherche et filtres partent avec la
   liste, seuls les onglets restent collés en haut (#menu-tabs sticky). */
#app{flex:1;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden}
#loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}

/* Tabs */
#menu-tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none;position:sticky;top:0;z-index:5}
#menu-tabs::-webkit-scrollbar{display:none}
.mtab{height:36px;padding:0 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0}
.mtab.active{background:rgba(245,166,35,.15);border-color:var(--accent);color:var(--accent)}

/* Products */
#menu-content{flex:none;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.menu-footnote{font-size:11px;color:var(--muted);text-align:center;padding:16px;letter-spacing:.3px;font-weight:600;text-transform:uppercase}
.sec-sep{padding:8px 16px;font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--muted);background:rgba(255,255,255,.02);border-top:1px solid var(--border);margin-top:6px}
/* Première section collée aux onglets : un seul trait (celui de #menu-tabs), pas de bande vide */
#menu-content > .sec-sep:first-child{margin-top:0;border-top:0}
/* Première section sous le bandeau « Plat du jour » : le bandeau donne déjà l'espace */
#menu-content > .pdj-wrap + .sec-sep{margin-top:0}
.prod-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.prod-card.sold-out{opacity:.5}
.prod-img{width:64px;height:64px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--card)}
.prod-img img{width:100%;height:100%;object-fit:cover;display:block}
.prod-info{flex:1}
.prod-name{font-size:15px;font-weight:600;margin-bottom:2px}
.prod-sub{font-size:12px;color:var(--muted);margin-bottom:6px;line-height:1.4}
.prod-price{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--green)}
.prod-variants{font-size:11px;color:var(--text);font-weight:600;margin-top:2px;line-height:1.4}
.prod-actions{flex-shrink:0}

/* Search + filters */
#search-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#search-input{flex:1;height:40px;padding:0 14px;background:var(--card);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
#search-input::placeholder{color:var(--muted-2)}
#search-input:focus{border-color:var(--accent)}
#filter-bar{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none}
#filter-bar::-webkit-scrollbar{display:none}
#filter-bar .chip{height:36px;padding:0 14px;font-size:13px;font-weight:700;flex-shrink:0}
/* Petits téléphones : la 4e puce reste entamée à l'écran (indice qu'on peut faire glisser) */
@media (max-width:374px){#filter-bar{gap:6px}#filter-bar .chip{padding:0 12px}}

/* Skeleton */
.skel-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.skel-img{width:64px;height:64px;border-radius:12px;flex-shrink:0}
.skel-content{flex:1;display:flex;flex-direction:column;gap:8px}

/* Toast — feedback (allergies appliquées) */
#client-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1);max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#client-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Allergies modal */
#allergies-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:160;display:none;align-items:center;justify-content:center;padding:16px}
#allergies-modal-inner{background:var(--surface);border-radius:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px 20px 20px;border:1px solid var(--border);position:relative}
#allergies-modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:14px;cursor:pointer;z-index:1}

#allergies-checkboxes label:has(input:checked){border-color:var(--accent) !important;background:rgba(245,166,35,.08) !important}
.chip-allergies[aria-pressed="true"]{background:rgba(232,64,64,.15) !important;border-color:rgba(232,64,64,.5) !important;color:#ff7878 !important}

/* Pastille allergènes sur card produit */
.prod-allergens-hint{font-size:11px;font-weight:700;color:#e84040;background:rgba(232,64,64,.1);border:1px solid rgba(232,64,64,.25);padding:2px 8px;border-radius:8px;margin-top:4px;display:inline-block;letter-spacing:.3px}

/* Badge "Épuisé" */
.badge-soldout{font-size:12px;font-weight:700;color:var(--red);background:rgba(232,64,64,.1);padding:6px 14px;border-radius:20px;white-space:nowrap}

/* Product detail modal */
#detail-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:flex-end;justify-content:center;padding:0}
#detail-modal.show{display:flex}
#detail-inner{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-top:1px solid var(--border);animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.detail-img{width:100%;aspect-ratio:1.3/1;background:var(--card);position:relative;overflow:hidden}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-img.placeholder{display:flex;align-items:center;justify-content:center;font-size:80px;opacity:.3}
#detail-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);z-index:10}
.detail-body{padding:20px 18px calc(28px + env(safe-area-inset-bottom))}
.detail-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1.05;margin-bottom:6px}
.detail-price{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--green);letter-spacing:1px;margin-bottom:14px}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.detail-tag{font-size:11px;font-weight:700;padding:5px 11px;border-radius:14px;letter-spacing:.4px}
.detail-tag.veg{background:rgba(34,201,122,.15);color:#22c97a;border:1px solid rgba(34,201,122,.3)}
.detail-tag.vegan{background:rgba(34,201,122,.2);color:#22c97a;border:1px solid rgba(34,201,122,.4)}
.detail-tag.spicy{background:rgba(232,64,64,.15);color:#e84040;border:1px solid rgba(232,64,64,.3)}
.detail-tag.allergen{background:rgba(245,166,35,.12);color:var(--accent);border:1px solid rgba(245,166,35,.25)}
.detail-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.detail-section-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px}
.detail-section-text{font-size:14px;line-height:1.5;color:var(--text)}
.detail-allergens-list{display:flex;flex-wrap:wrap;gap:6px}
#detail-variants{white-space:pre-line}
.prod-card{cursor:pointer}
/* Chevron discret : indique qu'on peut toucher le plat pour ouvrir sa fiche */
.prod-card::after{content:'›';content:'›'/'';flex-shrink:0;font-size:24px;line-height:1;color:var(--muted-2)}

/* Bandeau « Plat du jour » : en tête de la carte, sur tous les onglets */
.pdj-wrap{padding:12px 16px}
.pdj-banner{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);color:var(--text);text-align:left;cursor:pointer;transition:background .15s,transform .15s}
.pdj-banner:active{background:var(--card-hover);transform:scale(.99)}
.pdj-banner.sold-out{opacity:.6}
.pdj-banner .prod-img{display:block}
.pdj-info{display:block;flex:1;min-width:0}
.pdj-label{display:block;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;line-height:1;text-transform:uppercase;color:var(--accent)}
.pdj-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-size:16px;font-weight:700;line-height:1.25;margin-top:4px}
.pdj-price{display:block;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:var(--green);margin-top:3px}
.pdj-soldout{color:var(--red)}
.pdj-banner::after{content:'›';content:'›'/'';flex-shrink:0;font-size:26px;line-height:1;color:var(--accent)}

/* Carte sur tablette ou téléphone en paysage : grille au lieu d'une seule colonne étirée */
@media (min-width:720px){
  #menu-content{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-content:start}
  #menu-content > :not(.prod-card){grid-column:1/-1}  /* séparateurs, bandeau plat du jour, note TTC, état vide : pleine largeur */
  .prod-card{border-right:1px solid var(--border)}
  .prod-img{width:88px;height:88px}
  .prod-name{font-size:16px}
  .prod-sub{font-size:13px}
  .pdj-wrap{padding:16px}
  .pdj-banner{gap:16px;padding:12px 16px;max-width:760px}   /* pas étiré sur 1 280 px */
  .pdj-label{font-size:17px}
  .pdj-name{font-size:19px}
  .pdj-price{font-size:22px}
}
</style>
</head>
