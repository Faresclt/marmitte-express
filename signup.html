<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com https://*.firebaseio.com https://*.firebasestorage.app https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://cdnjs.cloudflare.com data: blob:; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Créer mon restaurant — La Marmite Express</title>
<meta name="description" content="Créez votre restaurant sur La Marmite Express en 30 secondes">
<meta property="og:title" content="Créer mon restaurant — La Marmite Express">
<meta property="og:description" content="Créez votre restaurant sur La Marmite Express en 30 secondes">
<meta property="og:image" content="icon-512.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f5a623">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design-system.css">
<link rel="stylesheet" href="assets/css/components.css">
<script src="assets/js/theme.js"></script>
<style>
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:480px}
  header{text-align:center;margin-bottom:32px}
  .header-logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:12px}
  .header-logo img{width:56px;height:56px;border-radius:12px;object-fit:cover}
  h1{font-family:var(--font-title);font-size:clamp(34px,7vw,46px);letter-spacing:1px;line-height:1}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:var(--fs-base);margin-top:8px}
  form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:16px}
  .field{display:flex;flex-direction:column;gap:6px}
  .input[readonly]{color:var(--muted);font-family:'DM Mono',monospace;font-size:13px}
  .hint{font-size:var(--fs-xs);color:var(--muted)}
  .foot{text-align:center;margin-top:20px;font-size:var(--fs-sm);color:var(--muted)}
  .foot a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-logo">
      <img src="icon-192.png" alt="Logo" onerror="this.style.display='none'">
    </div>
    <h1>La Marmite <span>Express</span></h1>
    <div class="sub">Créez votre restaurant en 30 secondes</div>
  </header>

  <form id="signup-form" autocomplete="on">
    <div class="field">
      <label class="label" for="restoName">Nom du restaurant</label>
      <input class="input" id="restoName" type="text" required placeholder="Le Petit Bistrot" maxlength="60">
    </div>
    <div class="field">
      <label class="label" for="slug">Identifiant URL</label>
      <input class="input" id="slug" type="text" readonly placeholder="le-petit-bistrot">
      <div class="hint">Généré automatiquement. Sera utilisé dans l'URL de votre caisse.</div>
    </div>
    <div class="field">
      <label class="label" for="email">Email administrateur</label>
      <input class="input" id="email" type="email" required placeholder="contact@monresto.fr" autocomplete="email">
    </div>
    <div class="field">
      <label class="label" for="pwd">Mot de passe</label>
      <input class="input" id="pwd" type="password" required minlength="8" placeholder="8 caractères minimum" autocomplete="new-password">
    </div>
    <div class="field">
      <label class="label" for="pwd2">Confirmer le mot de passe</label>
      <input class="input" id="pwd2" type="password" required minlength="8" autocomplete="new-password">
    </div>
    <button id="submit-btn" class="btn btn-primary btn-title btn-block btn-lg" type="submit" style="margin-top:8px">Créer mon restaurant</button>
  </form>

  <div class="foot">
    Vous avez déjà un compte ? <a href="marmite-express-caisse.html">Accéder à la caisse</a>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { auth, db } from './assets/js/firebase-sync.js';
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const nameEl = $('restoName');
const slugEl = $('slug');
const emailEl = $('email');
const pwdEl = $('pwd');
const pwd2El = $('pwd2');
const btn = $('submit-btn');
const toastEl = $('toast');

function slugify(str){
  return (str || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '') // retire accents
    .replace(/\s+/g, '-')
    .replace(/[^a-z0-9-]/g, '')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 40);
}

nameEl.addEventListener('input', () => {
  slugEl.value = slugify(nameEl.value);
});

let toastTimer = null;
function toast(msg, ok=false){
  toastEl.textContent = msg;
  toastEl.classList.toggle('ok', ok);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
}

function friendlyError(code){
  const map = {
    'auth/email-already-in-use': 'Cet email est déjà utilisé. Essayez de vous connecter.',
    'auth/invalid-email': 'Email invalide.',
    'auth/weak-password': 'Mot de passe trop faible (min 8 caractères).',
    'auth/network-request-failed': 'Problème réseau. Vérifiez votre connexion.',
    'auth/operation-not-allowed': 'Inscription désactivée. Contactez le support.'
  };
  return map[code] || 'Erreur lors de la création du compte. Réessayez.';
}

$('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = nameEl.value.trim();
  const slug = slugify(name);
  const email = emailEl.value.trim();
  const pwd = pwdEl.value;
  const pwd2 = pwd2El.value;

  if(!name || name.length < 2){ toast('Nom du restaurant trop court'); return; }
  if(!slug || slug.length < 2){ toast('Nom invalide (utilisez des lettres)'); return; }
  if(pwd.length < 8){ toast('Mot de passe : 8 caractères minimum'); return; }
  if(pwd !== pwd2){ toast('Les mots de passe ne correspondent pas'); return; }

  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>Création en cours...';

  try {
    // Vérifier que le slug est libre
    const existing = await getDoc(doc(db, 'restaurants', slug, 'meta', 'info'));
    if(existing.exists()){
      toast('Ce nom de restaurant est déjà pris');
      btn.disabled = false;
      btn.innerHTML = original;
      return;
    }

    // Création compte Firebase Auth
    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
    const uid = cred.user.uid;

    // Document meta du restaurant
    await setDoc(doc(db, 'restaurants', slug, 'meta', 'info'), {
      name,
      slug,
      plan: 'free',
      createdAt: serverTimestamp(),
      ownerUid: uid
    });

    // Document user admin
    await setDoc(doc(db, 'restaurants', slug, 'users', uid), {
      role: 'admin',
      email,
      addedAt: serverTimestamp()
    });

    localStorage.setItem('marmitte_resto_slug', slug);

    toast('Restaurant créé. Redirection...', true);
    setTimeout(() => {
      window.location.href = `marmite-express-caisse.html?resto=${encodeURIComponent(slug)}`;
    }, 800);

  } catch(err){
    console.error('Signup error:', err);
    toast(friendlyError(err.code));
    btn.disabled = false;
    btn.innerHTML = original;
  }
});
</script>
</body>
</html>
