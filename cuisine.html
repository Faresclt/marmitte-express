<script>
/* Brand pre-boot — voir index.html. Variante cuisine : #resto-logo-img. */
(function(){
  try {
    function read(k){
      var v = localStorage.getItem(k);
      if (v == null) return null;
      if (v.length >= 2 && v.charAt(0) === '"' && v.charAt(v.length-1) === '"') {
        try { return JSON.parse(v); } catch(e){}
      }
      return v;
    }
    var lu = read('brand_logoUrl');
    var ln = read('brand_name');
    var la = read('brand_accent');
    if (la) document.documentElement.style.setProperty('--accent', la);
    if (lu || ln) {
      window.__brandPreBoot = { logoUrl: lu, name: ln, accent: la };
    }
  } catch(e){}
})();
</script>

<script type="module">
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
import { db, collection, onSnapshot, updateDoc, deleteDoc, doc, serverTimestamp } from './assets/js/firebase-sync.js';

let orders = {};
let prevCount = 0;
let noCuisineCategories = [];
let noCuisineProductNames = new Set(); // Fallback: product names from noCuisine categories

// Audit cuisine #9 : seuil "late" configurable (avant hardcodé à 10 min L342).
// Lu depuis config/menu.lateThresholdMin pour permettre adaptation
// fast-food (5 min) vs gastro (30 min). Default 10 min si non défini.
let lateThresholdMin = 10;

// Audit cuisine #3 : AudioContext SINGLETON (avant : new AudioContext() à chaque
// playSound → fuite mémoire, Chrome bloque > 6 contexts → audio mort mi-service).
// Réutilise audioCtx créé dans unlockAudio() pour bénéficier du déblocage iOS.
// audioCtx déclaré plus bas L383 — on l'utilisera dans playSound.

// Audit cuisine #6 : toast helper minimaliste pour feedback erreur Firebase.
// Avant : doStatus/doClear catch silencieux → cuisinier re-clique 10× sans rien voir.
function toast(msg, kind){
  const el = document.createElement('div');
  el.setAttribute('role', 'alert');
  el.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:99999;background:'
    + (kind === 'err' ? '#e84040' : '#22c97a')
    + ';color:#fff;padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2500);
  setTimeout(() => el.remove(), 2900);
}

// ── États persistants (localStorage) ──
let soundOn = localStorage.getItem('cuisineSoundOn') !== 'false';
let voiceOn = localStorage.getItem('cuisineVoiceOn') !== 'false';

function updateButtons() {
  const sndBtn = document.getElementById('snd');
  const voiceBtn = document.getElementById('voiceBtn');
  sndBtn.textContent = soundOn ? '🔔' : '🔕';
  sndBtn.classList.toggle('active', soundOn);
  voiceBtn.textContent = voiceOn ? '🔊' : '🔇';
  voiceBtn.classList.toggle('active', voiceOn);
}
updateButtons();

// ── Chargement menu (catégories noCuisine + noms produits boissons) ──
onSnapshot(doc(db, 'config', 'menu'), snap => {
  const data = snap.data();
  // Branding cross-device
  if(data && data.branding){
    const b = data.branding;
    if(b.accent){
      document.documentElement.style.setProperty('--accent', b.accent);
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', b.accent);
    }
    const img = document.getElementById('resto-logo-img');
    if(img){
      if(b.logoUrl){
        if(img.src !== b.logoUrl) img.src = b.logoUrl;
        img.style.display = 'inline-block';
      } else { img.style.display = 'none'; }
    }
    const nameEl = document.getElementById('resto-name-cuisine');
    if(nameEl && b.name){ nameEl.textContent = '· ' + b.name; }
    if(b.name) document.title = b.name + ' — Cuisine';
    // Persiste en cache pour la prochaine visite (élimine le FOUC)
    window.BrandCache?.save(b);
  }
  let allCats = [];
  if (data && data.categories) {
    allCats = data.categories;
  } else if (data && data.cats) {
    allCats = data.cats || [];
  }
  noCuisineCategories = allCats
    .filter(c => c.noCuisine === true)
    .map(c => c.id || c.name);
  // Build product name set for fallback matching (old orders without cat field)
  noCuisineProductNames.clear();
  if (data && data.products && noCuisineCategories.length) {
    data.products.forEach(p => {
      if (noCuisineCategories.includes(p.cat)) {
        noCuisineProductNames.add((p.name||'').toLowerCase().trim());
      }
    });
  }
  console.log('[Cuisine] noCuisine cats:', noCuisineCategories, 'products:', [...noCuisineProductNames]);
  // Audit cuisine #9 : lire seuil "late" configurable. Default 10 min.
  if (data && typeof data.lateThresholdMin === 'number' && data.lateThresholdMin > 0){
    lateThresholdMin = data.lateThresholdMin;
  } else if (data && data.settings && typeof data.settings.lateThresholdMin === 'number'){
    lateThresholdMin = data.settings.lateThresholdMin;
  }
  // Re-render with updated filter
  if (Object.keys(orders).length > 0) renderAll();
});

// ── Écoute commandes ──
onSnapshot(collection(db, 'orders'), snap => {
  const nw = {};
  snap.forEach(d => nw[d.id] = { ...d.data(), _id: d.id });

  const actS = ['pending','received','preparing'];
  const nA = Object.values(nw).filter(o => actS.includes(o.status)).length;

  // Audit cuisine #4 : détecter les nouvelles commandes via la PRÉSENCE de
  // _id absents de la version précédente, plutôt que via un delta de count.
  // Avant : if (nA > oA) — bug si 1 commande arrive ET 1 passe à 'ready' dans
  // le même snapshot (nA=oA) → aucun son joué pendant le rush. Maintenant :
  // newOrders.length > 0 garantit détection même si compteur stable.
  const newOrders = Object.values(nw).filter(o =>
    actS.includes(o.status) && !orders[o._id]
  );

  // prevCount > 0 garde : pas de son au premier load (cache hydration)
  if (newOrders.length > 0 && prevCount > 0) {
    if (soundOn) playSound();
    if (voiceOn) speakOrder(newOrders[0]);
    // Audit cuisine #10 : tag = renotify la même notif au lieu d'empiler
    // 50 notifs OS. Auto-close après 8s.
    if (Notification.permission === 'granted'){
      const n = new Notification('Nouvelle commande !', {
        body: `Table ${newOrders[0].tableNum || newOrders[0].tableId || '?'}`,
        icon: 'icon-192.png',
        tag: 'cuisine-new-order',
        renotify: true
      });
      setTimeout(() => { try { n.close(); } catch(e){} }, 8000);
    }
  }
  prevCount = nA;
  orders = nw;
  renderAll();
  document.getElementById('sdot').classList.add('on');
  document.getElementById('stxt').textContent = 'Connecté';
});

// Audit cuisine #6 : feedback erreur visuel (avant : catch silencieux).
// Si Firebase down ou règles refusent, le cuisinier voit "Erreur — réessayez"
// au lieu de re-cliquer 10 fois dans le vide.
window.doStatus = async function(id, s) {
  try {
    await updateDoc(doc(db, 'orders', id), { status: s, updatedAt: serverTimestamp() });
  } catch(e) {
    console.error('[Cuisine] doStatus fail:', e);
    toast('Erreur réseau — réessayez', 'err');
  }
};

// Audit cuisine #2 : soft-delete + confirm (avant : deleteDoc dur silencieux).
// La commande reste en base avec status='cancelled' + cancelledAt — traçable
// pour réclamation client ("j'ai commandé y a 2h") et audit interne.
// Conformité NF525 partielle : si l'order est lié à un ticket fiscal, la
// suppression dure créerait un trou comptable.
window.doClear = async function(id) {
  const o = orders[id];
  const tbl = o ? (o.tableNum || o.tableId || '?') : '?';
  if (!confirm(`Annuler la commande de la table ${tbl} ?\n\nElle restera consultable dans l'historique (status: cancelled) mais disparaîtra de l'écran cuisine.`)) return;
  try {
    await updateDoc(doc(db, 'orders', id), {
      status: 'cancelled',
      cancelledAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    toast(`✓ Commande table ${tbl} annulée`);
  } catch(e) {
    console.error('[Cuisine] doClear fail:', e);
    toast('Erreur — annulation refusée', 'err');
  }
};

function minsAgo(o) {
  if (!o.sentAt) return 0;
  const sent = o.sentAt.toDate ? o.sentAt.toDate() : new Date(o.sentAt.seconds * 1000);
  return Math.floor((Date.now() - sent.getTime()) / 60000);
}

// ── Filtre : exclure les items des catégories noCuisine ──
function filterCuisineItems(items) {
  if (!noCuisineCategories.length) return items;
  return items.filter(i => {
    // Primary: match by category ID
    const cat = i.catId || i.cat || i.category || '';
    if (cat && noCuisineCategories.includes(cat)) return false;
    // Fallback: match by product name (for old orders without cat field)
    if (!cat && noCuisineProductNames.size > 0) {
      const name = (i.name||'').toLowerCase().trim();
      if (noCuisineProductNames.has(name)) return false;
    }
    return true;
  });
}

// Audit cuisine #1 : renderAll DEBOUNCED 200ms + skip si signature identique.
// Avant : chaque snapshot Firebase → innerHTML rewrite des 3 colonnes immédiat.
// Si cuisinier tap "EN PRÉPARATION" pile à ce moment, son doigt rate le bouton
// (DOM recréé entre tap-start et tap-end). Maintenant : on debounce les rafales
// de snapshots typiques pendant un rush + skip si rien n'a vraiment changé.
let _renderTimer = null;
let _lastRenderSig = '';
const renderAll = function(){
  clearTimeout(_renderTimer);
  _renderTimer = setTimeout(_renderAllImpl, 200);
};

function _renderAllImpl() {
  // Audit cuisine #14 : tri robuste si sentAt manquant (premiers snapshots
  // avant que serverTimestamp soit résolu). Fallback ts client puis _id pour
  // ordre déterministe.
  const all = Object.values(orders).sort((a,b) => {
    const sa = a?.sentAt?.seconds || a?._localTs || 0;
    const sb = b?.sentAt?.seconds || b?._localTs || 0;
    if (sa !== sb) return sa - sb;
    return (a?._id || '').localeCompare(b?._id || '');
  });
  // Skip si rien n'a changé visuellement (évite rebuild inutile + bouton recréé)
  const sig = all.map(o => `${o._id}:${o.status}:${(o.items||[]).length}`).join('|');
  if (sig === _lastRenderSig) return;
  _lastRenderSig = sig;

  const received = all.filter(o => o.status === 'received' || o.status === 'pending');
  const preparing = all.filter(o => o.status === 'preparing');
  const ready = all.filter(o => o.status === 'ready');

  const receivedF = received.filter(o => filterCuisineItems(o.items||[]).length > 0);
  const preparingF = preparing.filter(o => filterCuisineItems(o.items||[]).length > 0);
  const readyF = ready.filter(o => filterCuisineItems(o.items||[]).length > 0);

  document.getElementById('col-new').innerHTML = receivedF.length
    ? receivedF.map(o => makeTicket(o, 'new')).join('')
    : '<div class="empty">✓ Pas de nouvelles commandes</div>';
  document.getElementById('col-prep').innerHTML = preparingF.length
    ? preparingF.map(o => makeTicket(o, 'prep')).join('')
    : '<div class="empty">Rien en préparation</div>';
  document.getElementById('col-ready').innerHTML = readyF.length
    ? readyF.map(o => makeTicket(o, 'ready')).join('')
    : '<div class="empty">Rien de prêt</div>';

  const bn = document.getElementById('bn'); bn.textContent = receivedF.length; bn.style.display = receivedF.length ? 'flex' : 'none';
  const bp = document.getElementById('bp'); bp.textContent = preparingF.length; bp.style.display = preparingF.length ? 'flex' : 'none';
  const br = document.getElementById('br'); br.textContent = readyF.length; br.style.display = readyF.length ? 'flex' : 'none';

  document.getElementById('s-act').textContent = received.length + preparing.length;
  const today = new Date().toDateString();
  document.getElementById('s-tod').textContent = all.filter(o => {
    const d = o.sentAt?.toDate ? o.sentAt.toDate() : null;
    return d && d.toDateString() === today;
  }).length;

  const activeItems = [...receivedF, ...preparingF].flatMap(o => filterCuisineItems(o.items||[]));
  const sum = {};
  activeItems.forEach(i => { if (!sum[i.name]) sum[i.name] = 0; sum[i.name] += i.qty; });
  const arr = Object.entries(sum).sort((a,b) => b[1] - a[1]);
  document.getElementById('sum-body').innerHTML = arr.length
    ? arr.map(([n,q]) => `<div class="stag"><span class="stag-q">${q}×</span>${n}</div>`).join('')
    : '<span style="color:#5a5e72">Aucune commande active</span>';
}

function makeTicket(o, type) {
  const items = filterCuisineItems(o.items || []);
  const tbl = o.tableNum || o.tableId || '?';
  const time = o.sentAt?.toDate ? o.sentAt.toDate().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '';
  const mins = minsAgo(o);
  // Audit cuisine #9 : seuil "late" via lateThresholdMin (config-driven)
  const late = type === 'new' && mins >= lateThresholdMin;
  // _id Firestore ne contient théoriquement que [a-zA-Z0-9_-] mais on échappe
  // par défense en profondeur (quote-safe inside onclick=").
  const idEsc = esc(o._id);

  let btns = '';
  if (type === 'new') btns = `<button class="tbtn tbtn-prep" onclick="doStatus('${idEsc}','preparing')">🔥 EN PRÉPARATION</button>`;
  else if (type === 'prep') btns = `<button class="tbtn tbtn-ready" onclick="doStatus('${idEsc}','ready')">✅ PRÊT À SERVIR</button>`;
  else btns = `<button class="tbtn tbtn-done" onclick="doStatus('${idEsc}','served')">🍽️ SERVI</button><button class="tbtn tbtn-clr" onclick="doClear('${idEsc}')">✕</button>`;

  // Audit cuisine #5 : XSS — esc() partout. Avant : i.name / i.cuisson /
  // i.garniture injectés sans échappement. Un nom de produit '<script>' (admin
  // malicieux ou bug input) exécutait du JS arbitraire dans cuisine.html.
  let itemsHTML = '';
  for (const i of items) {
    const opts = [i.cuisson, i.garniture].filter(Boolean);
    const qty = Number(i.qty) || 0;
    itemsHTML += `<div class="tkt-row"><span class="tkt-qty">${qty}×</span><span class="tkt-nm">${esc(i.name).toUpperCase()}</span></div>`;
    if (opts.length) itemsHTML += `<div class="tkt-tags">${opts.map(x=>`<span class="tkt-tag">${esc(x)}</span>`).join('')}</div>`;
  }

  return `<div class="tkt ${type}${late?' late':''}">
    <div class="tkt-hd">
      <div class="tkt-tbl">TABLE ${esc(tbl)}</div>
      <div><div class="tkt-time">${esc(time)}</div>${mins>0?`<div class="tkt-ago${late?' late-txt':''}">${mins} min</div>`:''}</div>
    </div>
    <div class="tkt-body">${itemsHTML}</div>
    ${o.note?`<div class="tkt-note">⚠️ ${esc(o.note)}</div>`:''}
    <div class="tkt-act">${btns}</div>
  </div>`;
}

// Audit cuisine #3 : SINGLETON AudioContext (réutilise audioCtx créé par
// unlockAudio L383). Avant : new AudioContext() à chaque playSound → Chrome
// limite à ~6 contexts → audio mort après 6-100 commandes (mi-service).
// Si audioCtx pas encore débloqué (avant clic "Activer le son"), on tente
// quand même via lazy-init (le bip restera muté tant que l'user n'a pas cliqué,
// comportement navigateur normal).
function playSound(freqs) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const c = audioCtx;
    const tones = freqs || [880, 1100, 1320]; // pattern défaut "nouvelle commande"
    tones.forEach((freq, i) => {
      const d = i * 0.15;
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.frequency.setValueAtTime(freq, c.currentTime+d);
      g.gain.setValueAtTime(.3, c.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime+d+.2);
      o.start(c.currentTime+d); o.stop(c.currentTime+d+.2);
    });
  } catch(e) { console.warn('[Cuisine] playSound fail:', e.message); }
}

// Audit cuisine #7/#8/#13 : tick périodique pour rafraîchir les badges "X min",
// le compteur "Aujourd'hui" (reset à minuit) et détecter les passages en late.
// Avant : minsAgo recalculé uniquement au snapshot → si rien ne change pendant
// 30 min, le badge affichait toujours "5 min" alors qu'il devait dire "35 min".
// #13 : son d'alerte (note plus aiguë) joué une seule fois quand un order
// franchit le seuil late (suivi via window._lateNotified Set).
window._lateNotified = new Set();
function tickRefresh(){
  // Force re-render (skip identique laissé par renderAll géré séparément)
  // — on signe avec mins en plus pour invalider _lastRenderSig.
  _lastRenderSig = ''; // invalide le skip cache
  _renderAllImpl();
  // Détecte les nouveaux late
  Object.values(orders).forEach(o => {
    if ((o.status === 'received' || o.status === 'pending') && minsAgo(o) >= lateThresholdMin){
      if (!window._lateNotified.has(o._id)){
        window._lateNotified.add(o._id);
        if (soundOn) playSound([1500, 1500, 1500]); // 3 bips aigus pour late
      }
    } else {
      window._lateNotified.delete(o._id);
    }
  });
}
setInterval(tickRefresh, 30 * 1000); // toutes les 30s

// ── Audio unlock system (contourne les restrictions navigateur) ──
let audioUnlocked = false;
let audioCtx = null;
let speechQueue = [];

window.unlockAudio = function() {
  const btn = document.getElementById('audio-unlock');
  // Audit cuisine #11 : demander la permission Notification depuis un user
  // gesture (bouton "Activer le son") au lieu du load (anti-pattern UX).
  // Avant : prompt navigateur dès l'ouverture de la page, ignoré par 80% des users.
  if ('Notification' in window && Notification.permission === 'default'){
    try { Notification.requestPermission(); } catch(e){}
  }
  // 1. Unlock AudioContext
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
  } catch(e) {}
  // 2. Unlock SpeechSynthesis with silent utterance
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const silentUtt = new SpeechSynthesisUtterance('');
    silentUtt.volume = 0;
    silentUtt.lang = 'fr-FR';
    window.speechSynthesis.speak(silentUtt);
    // Then speak confirmation
    setTimeout(() => {
      const confirm = new SpeechSynthesisUtterance('Audio activé. En attente de commandes.');
      confirm.lang = 'fr-FR';
      confirm.rate = 1;
      confirm.pitch = 1;
      confirm.volume = 1;
      window.speechSynthesis.speak(confirm);
    }, 200);
  }
  audioUnlocked = true;
  btn.textContent = '🔊 Son activé';
  btn.classList.add('unlocked');
  // Process any queued orders
  speechQueue.forEach(o => speakOrder(o));
  speechQueue = [];
};

// Audit cuisine #12 : file d'attente vocale au lieu de cancel().
// Avant : `speechSynthesis.cancel()` à chaque appel → si 5 commandes arrivent
// en 2s, seule la dernière est lue, les 4 autres sont perdues. Maintenant :
// on enchaîne via onend, le cuisinier entend TOUTES les commandes.
let _speakingQueue = [];
let _speaking = false;
function _speakNext(){
  if (_speakingQueue.length === 0){ _speaking = false; return; }
  _speaking = true;
  const texte = _speakingQueue.shift();
  const utt = new SpeechSynthesisUtterance(texte);
  utt.lang = 'fr-FR';
  utt.rate = 0.92;
  utt.pitch = 1.05;
  utt.volume = 1;
  // Workaround: Chrome sometimes pauses long utterances
  utt.onpause = () => window.speechSynthesis.resume();
  utt.onend = _speakNext;
  utt.onerror = _speakNext;
  window.speechSynthesis.speak(utt);
}

function speakOrder(order) {
  if (!('speechSynthesis' in window)) return;
  if (!audioUnlocked) { speechQueue.push(order); return; }
  const items = filterCuisineItems(order.items || []);
  if (!items.length) return;
  const tbl = order.tableNum || order.tableId || '?';
  const liste = items.map(i => {
    let desc = `${Number(i.qty) || 1} ${i.name || ''}`;
    if (i.cuisson) desc += `, cuisson ${i.cuisson}`;
    if (i.garniture) desc += `, avec ${i.garniture}`;
    return desc;
  }).join('. ');
  const texte = `Nouvelle commande, table ${tbl}. ${liste}.`;
  _speakingQueue.push(texte);
  // Cap la queue à 3 messages max (évite que pendant un mega-rush
  // la voix prenne 5 min de retard sur la cuisine)
  if (_speakingQueue.length > 3) _speakingQueue = _speakingQueue.slice(-3);
  if (!_speaking) _speakNext();
}

window.toggleSound = function() {
  soundOn = !soundOn;
  localStorage.setItem('cuisineSoundOn', soundOn);
  updateButtons();
};
window.toggleVoice = function() {
  voiceOn = !voiceOn;
  localStorage.setItem('cuisineVoiceOn', voiceOn);
  updateButtons();
};
window.toggleSum = function() { document.getElementById('sum').classList.toggle('open'); };

// Audit cuisine #11 : permission demandée dans unlockAudio() (user gesture),
