<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://*.googleapis.com https://*.gstatic.com https://*.firebaseio.com https://firestore.googleapis.com data: blob:; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ticket — La Marmite Express</title>
<meta name="theme-color" content="#f5a623">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design-system.css">
<style>
body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; }
.wrap { max-width: 480px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
.hdr { background: linear-gradient(135deg, var(--accent), var(--accent-2)); padding: 24px; text-align: center; color: var(--on-accent); }
.hdr .logo { width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 12px; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; font-size: 36px; overflow: hidden; }
.hdr .logo img { width: 100%; height: 100%; object-fit: cover; }
.hdr h1 { font-family: var(--font-title); font-size: 26px; letter-spacing: 1.5px; margin: 0; }
.hdr .meta { font-size: 12px; opacity: .85; margin-top: 4px; font-weight: 600; }
.body { padding: 20px; }
.info-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.info-row strong { color: var(--text); font-weight: 700; }
.items { font-size: 14px; }
.item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.item:last-child { border-bottom: none; }
.item-name { flex: 1; padding-right: 12px; }
.item-opts { font-size: 11px; color: var(--muted); margin-top: 2px; }
.item-price { font-weight: 700; white-space: nowrap; }
.total { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 2px solid var(--text); font-family: var(--font-title); font-size: 24px; letter-spacing: 1px; }
.total .amount { color: var(--accent); }
.tax-row { font-size: 11px; color: var(--muted); text-align: right; margin-top: 4px; }
.reviews { margin-top: 24px; padding: 20px; background: var(--card); border-radius: var(--radius); text-align: center; }
.reviews-title { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; font-weight: 600; }
.review-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.review-btns a { flex: 1; min-width: 140px; padding: 12px 16px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 13px; text-decoration: none; }
.review-btns .g { background: #4285F4; }
.review-btns .t { background: #00aa6c; }
.footer { text-align: center; padding: 16px; font-size: 11px; color: var(--muted); }
.actions { margin-top: 16px; display: flex; gap: 10px; }
.actions button { flex: 1; height: 44px; border-radius: var(--radius-sm); background: var(--card); border: 1px solid var(--border); color: var(--text); font-weight: 700; font-size: 13px; }
#loading, #error { text-align: center; padding: 60px 20px; }
#error { color: var(--red); }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media print {
  body { background: #fff; color: #000; }
  .actions, .footer { display: none; }
  .card { border: 2px solid #000; box-shadow: none; }
  .hdr { background: none !important; color: #000 !important; border-bottom: 2px solid #000; }
  .reviews { background: #f5f5f5; }
}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">
    <div class="spinner"></div>
    <div style="color: var(--muted); font-size: 14px;">Chargement du ticket…</div>
  </div>
  <div id="error" style="display:none">
    <div style="font-size: 48px; margin-bottom: 12px;">❌</div>
    <div id="error-msg">Ticket introuvable ou expiré.</div>
  </div>
  <div id="ticket-content" style="display:none"></div>
</div>

<script type="module">
import { db, doc, getDoc } from './assets/js/firebase-sync.js';

const params = new URLSearchParams(location.search);
const id = params.get('id');

if (!id) {
  showError('Aucun identifiant de ticket fourni.');
} else {
  loadTicket(id);
}

async function loadTicket(id) {
  try {
    const snap = await getDoc(doc(db, 'tickets', id));
    if (!snap.exists()) {
      showError('Ticket introuvable ou expiré.');
      return;
    }
    render(snap.data());
  } catch (e) {
    console.error(e);
    showError('Erreur de chargement : ' + (e.message || 'inconnue'));
  }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'block';
  document.getElementById('error-msg').textContent = msg;
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render(t) {
  const resto = t.resto || {};
  const items = t.items || [];
  const reviews = t.reviews || {};

  if (resto.accent) {
    document.documentElement.style.setProperty('--accent', resto.accent);
  }
  if (resto.name) {
    document.title = 'Ticket — ' + resto.name;
  }

  const logoHTML = resto.logoUrl
    ? `<img src="${esc(resto.logoUrl)}" alt="logo">`
    : (resto.emoji || '🍲');

  const tableLine = t.tableNum ? `Table ${esc(t.tableNum)}` : 'Vente directe';
  const payLabel = t.payType === 'cb' ? 'Carte bancaire' : t.payType === 'cash' ? 'Espèces' : 'Offert';

  const itemsHTML = items.map(i => {
    const opts = [i.cuisson, i.garniture].filter(Boolean).join(', ');
    return `
      <div class="item">
        <div class="item-name">
          ${esc(i.qty)}× ${esc(i.name)}
          ${opts ? `<div class="item-opts">${esc(opts)}</div>` : ''}
        </div>
        <div class="item-price">${(i.qty * i.price).toFixed(2)}€</div>
      </div>`;
  }).join('');

  const reviewsHTML = (reviews.google || reviews.tripadvisor) ? `
    <div class="reviews">
      <div class="reviews-title">Vous avez aimé ? Laissez-nous un avis 💛</div>
      <div class="review-btns">
        ${reviews.google ? `<a class="g" href="${esc(reviews.google)}" target="_blank">⭐ Avis Google</a>` : ''}
        ${reviews.tripadvisor ? `<a class="t" href="${esc(reviews.tripadvisor)}" target="_blank">🦉 TripAdvisor</a>` : ''}
      </div>
    </div>
  ` : '';

  const html = `
    <div class="card">
      <div class="hdr">
        <div class="logo">${logoHTML}</div>
        <h1>${esc(resto.name || 'Restaurant')}</h1>
        <div class="meta">${esc(resto.tagline || 'Merci de votre visite !')}</div>
      </div>
      <div class="body">
        <div class="info-row">
          <span><strong>${esc(tableLine)}</strong></span>
          <span>${esc(t.date || '')} · ${esc(t.time || '')}</span>
        </div>
        <div class="items">${itemsHTML}</div>
        <div class="total"><span>TOTAL</span><span class="amount">${(t.total || 0).toFixed(2)}€</span></div>
        ${t.tax ? `<div class="tax-row">dont TVA : ${t.tax.toFixed(2)}€</div>` : ''}
        <div class="info-row" style="border-top:1px solid var(--border);border-bottom:none;padding-top:14px;margin-top:14px;margin-bottom:0">
          <span>Règlement</span>
          <span><strong>${esc(payLabel)}</strong></span>
        </div>
        ${reviewsHTML}
        <div class="actions">
          <button onclick="window.print()">🖨️ Imprimer</button>
        </div>
      </div>
    </div>
    <div class="footer">Ticket généré le ${esc(t.date || '')} · ${esc(resto.name || '')}</div>
  `;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('ticket-content').innerHTML = html;
  document.getElementById('ticket-content').style.display = 'block';
}
</script>
</body>
</html>
