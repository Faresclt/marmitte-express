<script>
/* Brand pre-boot — voir index.html pour la justification.
   Variante serveur : cible #resto-logo (img). */
(function(){
  try {
    function read(k){
      var v = localStorage.getItem(k);
      if (v == null) return null;
      if (v.length >= 2 && v.charAt(0) === '"' && v.charAt(v.length-1) === '"') {
        try { return JSON.parse(v); } catch(e){}
      }
      return v;
    }
    var lu = read('brand_logoUrl');
    var ln = read('brand_name');
    var la = read('brand_accent');
    // Cache local = donnée Firestore : couleur #hex et URL https/data:image/relative seulement
    if (la && !/^#[0-9a-f]{3,8}$/i.test(la)) la = null;
    if (lu && !/^(https:\/\/|data:image\/(png|jpe?g|webp|gif|avif);base64,|(\.{0,2}\/)?[a-z0-9_-][^:]*$)/i.test(lu)) lu = null;
    if (la) document.documentElement.style.setProperty('--accent', la);
    if (lu) {
      // Précharge l'image pour gagner sur le RTT réseau
      var pre = document.createElement('link');
      pre.rel = 'preload';
      pre.as = 'image';
      pre.href = lu;
      document.head.appendChild(pre);
      document.documentElement.classList.add('has-cached-brand-logo');
    }
    if (lu || ln) {
      window.__brandPreBoot = { logoUrl: lu, name: ln, accent: la };
    }
  } catch(e){}
})();
</script>

<script type="module">
import { db, doc, onSnapshot, setDoc, collection, getDoc, getDocFromServer, serverTimestamp, escHtml, safeUrl, safeColor, optImg, requireStaff, query, where } from './assets/js/firebase-sync.js';

// Appareil du personnel : bandeau / écran d'enregistrement si non enregistré.
requireStaff({ label: 'Serveur', page: 'serveur' });

// Plus aucun onclick construit avec une donnée : data-* + délégation partout
// (l'ancien escJs n'échappait pas les guillemets doubles → sortie d'attribut).

// Audit serveur #6 : lock anti-double-envoi sendOrder.
let _orderInFlight = false;
// Idempotence : id de commande généré côté client, gardé tant que l'envoi n'a
// pas réussi → un nouvel essai réécrit le MÊME document (pas de doublon).
let _pendingOrderRef = null;
function cartChanged(){ _pendingOrderRef = null; saveCart(); }

// Get table number from URL: client.html?table=3
const params = new URLSearchParams(window.location.search);
let tableNum = params.get('table') ? String(params.get('table')).slice(0, 20) : null;
let tableId = params.get('id') ? String(params.get('id')).slice(0, 40) : (tableNum ? 't'+tableNum : null);

let menu = null;
let cart = [];          // panier de la table courante
let productImages = {};
// Contrat service worker : ne pas recharger la page pendant une saisie.
window.__isBusy = () => cart.length > 0 || _orderInFlight;

// ── Un panier par table ──
// Changer de table ne perd plus rien : le panier (lignes + note + id de commande
// en attente) est rangé sous son tableId, puis restauré au retour sur la table.
// Persisté en localStorage → un rechargement de page ne perd rien non plus.
// Un panier n'est vidé qu'après l'envoi réussi de SA commande.
// Entrée : { num, items, note, pendingId, ts }. Les paniers de plus de 12 h
// (service précédent) sont ignorés au chargement.
const CARTS_KEY = 'serveur_carts';
const CART_TTL_MS = 12 * 3600 * 1000;
function loadCarts(){
  const out = Object.create(null); // pas de prototype : une clé "__proto__" reste une clé
  try{
    const raw = JSON.parse(localStorage.getItem(CARTS_KEY) || '{}');
    if(!raw || typeof raw !== 'object') return out;
    const now = Date.now();
    for(const [k, e] of Object.entries(raw)){
      if(!e || typeof e !== 'object' || !Array.isArray(e.items)) continue;
      if(!(now - Number(e.ts) < CART_TTL_MS)) continue;
      const items = e.items.filter(r => r && typeof r === 'object'
        && (typeof r.pid === 'string' || typeof r.pid === 'number')
        && typeof r.name === 'string'
        && Number(r.qty) > 0 && Number.isFinite(Number(r.price)));
      const note = typeof e.note === 'string' ? e.note.slice(0, 500) : '';
      if(!items.length && !note) continue;
      out[String(k).slice(0, 40)] = {
        num: String(e.num || '').slice(0, 20),
        items,
        note,
        pendingId: (typeof e.pendingId === 'string' && /^[A-Za-z0-9]{1,40}$/.test(e.pendingId)) ? e.pendingId : null,
        ts: Number(e.ts)
      };
    }
  }catch(_){ /* stockage corrompu ou indisponible → paniers vides */ }
  return out;
}
const cartsByTable = loadCarts();
function persistCarts(){
  try { localStorage.setItem(CARTS_KEY, JSON.stringify(cartsByTable)); } catch(_){}
}
// Range le panier courant (lignes + note + id en attente) sous la table courante
function saveCart(){
  if(!tableId) return;
  const note = String(document.getElementById('cp-note')?.value || '').slice(0, 500);
  if(cart.length || note){
    cartsByTable[tableId] = {
      num: String(tableNum || ''),
      items: cart.map(r => ({...r})),
      note,
      pendingId: _pendingOrderRef ? _pendingOrderRef.id : null,
      ts: Date.now()
    };
  } else {
    delete cartsByTable[tableId];
  }
  persistCarts();
}
// Recharge le panier de la table courante (vide si aucun)
function restoreCart(){
  const e = tableId ? cartsByTable[tableId] : null;
  cart = e ? e.items.map(r => ({...r})) : [];
  _pendingOrderRef = (e && e.pendingId) ? doc(db, 'orders', e.pendingId) : null;
  const noteEl = document.getElementById('cp-note');
  if(noteEl) noteEl.value = e ? e.note : '';
  const errEl = document.getElementById('cp-error');
  if(errEl) errEl.style.display = 'none';
  const btn = document.getElementById('cp-send');
  if(btn && !_orderInFlight) btn.textContent = _pendingOrderRef ? '✅ Réessayer (sans doublon)' : '✅ Confirmer la commande';
}
function cartCountFor(id){
  const e = cartsByTable[id];
  return e ? e.items.reduce((s, r) => s + (Number(r.qty) || 0), 0) : 0;
}

// ── Prix / options (même logique que la caisse) ──
const SIROP_PRICE = 0.5;
function variantsOf(p){
  return (p && p.hasVariant && Array.isArray(p.variants))
    ? p.variants.filter(v => v && typeof v.label === 'string' && Number.isFinite(Number(v.price)))
    : [];
}
function unitPrice(p, variant, sirop){
  let price = Number(p && p.price) || 0;
  const v = variantsOf(p).find(x => x.label === variant);
  if(v) price = Number(v.price) || 0;
  if(sirop && p && p.hasSirop) price += SIROP_PRICE;
  return Math.round(price * 100) / 100;
}
function needsOptions(p){ return !!(p && (p.hasCuisson || p.hasGarniture || variantsOf(p).length || p.hasSirop)); }
function lineKey(r){ return [r.pid, r.variant || '', r.cuisson || '', r.garniture || '', r.sirop ? 'sirop' : ''].join('|'); }
function fmtEur(n){ return (Number(n) || 0).toFixed(2).replace('.',','); }
function priceLabel(p){
  const vs = variantsOf(p);
  if(vs.length) return 'dès ' + fmtEur(Math.min(...vs.map(v => Number(v.price) || 0))) + ' €';
  return fmtEur(p.price) + ' €';
}
// Nombre CSS sûr pour les styles inline du plan de salle
function px(v, d){ const n = Number(v); return Number.isFinite(n) ? n : d; }

// Update page title and table display
function updateTableDisplay(){
  document.getElementById('table-display').textContent = tableNum || '?';
  document.title = tableNum ? `Table ${tableNum} — Commander` : 'Serveur — La Marmite Express';
}
updateTableDisplay();
restoreCart();   // table venue de l'URL : reprend son panier sauvegardé
updateCartBar();
// La note fait partie du panier de la table : sauvegardée à chaque frappe
document.getElementById('cp-note').addEventListener('input', saveCart);

// Show table picker if no table selected
function showTablePicker(){
  const picker = document.getElementById('table-picker');
  if(!picker) return;
  if(!menu || !menu.salleLayout || !menu.salleLayout.length){
    picker.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">Plan de salle non disponible.<br>Publiez depuis la caisse.<div style="margin-top:20px"><a href="index.html" class="tp-back">‹ Accueil</a></div></div>';
    picker.style.display='flex';
    return;
  }
  const elements = menu.salleLayout;
  // Calculate bounds for scaling
  let maxX=0, maxY=0;
  // Même géométrie que la caisse (v86) : w/h libres pour les tables (carré,
  // ovale), rot = rotation en degrés, porte, murs et plantes pour se repérer.
  const isTable = (e) => e.type==='table-round' || e.type==='table-rect';
  const posNum = (v, d) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : d; };
  const box = (e) => {
    if(isTable(e) && Number(e.w) > 0 && Number(e.h) > 0) return { w:posNum(e.w,90), h:posNum(e.h,90) };
    if(e.type==='table-rect'){ const s = posNum(e.size,110); return { w:s*1.4, h:s }; }
    if(e.type==='bar')  return { w:posNum(e.w,160), h:posNum(e.h,55) };
    if(e.type==='wall') return { w:posNum(e.w,12),  h:posNum(e.h,100) };
    if(e.type==='door') return { w:posNum(e.w,90),  h:posNum(e.h,80) };
    if(e.type==='plant'){ const s = posNum(e.size,44); return { w:s, h:s }; }
    const s = posNum(e.size,90); return { w:s, h:s };
  };
  const rotOf = (e) => Math.max(-180, Math.min(180, Number(e.rot) || 0));
  elements.forEach(e=>{
    const b = box(e);
    maxX=Math.max(maxX, px(e.x,0)+b.w);
    maxY=Math.max(maxY, px(e.y,0)+b.h);
  });

  // Audit serveur #1 : plan de salle venant de Firestore. Plus d'onclick
  // construit avec id/numéro : data-tidx (index dans `elements`) + délégation ;
  // coordonnées forcées en nombres ; numéro échappé.
  let elHtml = '';
  const hoverOn = "this.style.borderColor='var(--accent)';this.style.background='rgba(245,166,35,.15)'";
  const hoverOff = "this.style.borderColor='#22c97a';this.style.background='rgba(34,201,122,.1)'";
  elements.forEach((el, idx)=>{
    const numHtml = escHtml(el.number || '');
    const seats = Number(el.seats) || 0;
    const x = px(el.x,0), y = px(el.y,0);
    // Pastille « panier en cours » (nombre seulement, jamais de donnée texte)
    const pending = (el.type==='table-round' || el.type==='table-rect') ? cartCountFor(String(el.id ?? '')) : 0;
    const badge = pending ? `<div style="position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent);color:#000;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:none">🛒${pending}</div>` : '';
    const b = box(el);
    const rot = rotOf(el);
    const tf = rot ? `transform:rotate(${rot}deg);` : '';
    const untf = rot ? `transform:rotate(${-rot}deg);` : '';
    if(isTable(el)){
      const round = el.type==='table-round';
      const small = Math.min(b.w, b.h) <= 80;
      elHtml+=`<div data-tidx="${idx}" style="position:absolute;left:${x}px;top:${y}px;width:${b.w}px;height:${b.h}px;border-radius:${round?'50%':'12px'};background:rgba(34,201,122,.1);border:2.5px solid #22c97a;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,background .15s;user-select:none;${tf}" onmouseover="${hoverOn}" onmouseout="${hoverOff}">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:${small?15:22}px;color:#22c97a;line-height:1;${untf}">${numHtml}</div>
        <div style="font-size:10px;color:var(--muted);font-weight:600;${untf}">${seats} cvts</div>
        ${badge}
      </div>`;
    } else if(el.type==='bar'){
      elHtml+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${b.w}px;height:${b.h}px;border-radius:10px;background:rgba(74,158,255,.1);border:2px solid rgba(74,158,255,.4);display:flex;align-items:center;justify-content:center;gap:6px;pointer-events:none">
        <span style="font-size:18px">🍺</span><span style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:#4a9eff">${numHtml || 'BAR'}</span>
      </div>`;
    } else if(el.type==='wall'){
      elHtml+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${b.w}px;height:${b.h}px;border-radius:4px;background:rgba(255,255,255,.18);pointer-events:none"></div>`;
    } else if(el.type==='door'){
      elHtml+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${b.w}px;height:${b.h}px;border-left:2px dashed rgba(255,255,255,.35);border-bottom:2px dashed rgba(255,255,255,.35);border-bottom-left-radius:100%;display:flex;justify-content:center;pointer-events:none"><span style="font-size:12px;font-weight:700;color:var(--muted);margin-top:4px">🚪 ${numHtml || 'Entrée'}</span></div>`;
    } else if(el.type==='plant'){
      elHtml+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${b.w}px;height:${b.h}px;border-radius:50%;background:rgba(34,201,122,.08);display:flex;align-items:center;justify-content:center;font-size:${Math.round(b.w*0.5)}px;pointer-events:none">🌿</div>`;
    }
  });
  
  picker.innerHTML = `
    <div id="tp-root" style="width:100%;height:100%;display:flex;flex-direction:column">
      <div style="padding:16px;text-align:center;flex-shrink:0">
        <div class="tp-bar"><a href="index.html" class="tp-back">‹ Accueil</a>${(tableId && tableNum) ? `<button type="button" id="tp-stay" class="tp-stay">↩ Rester table ${escHtml(tableNum)}</button>` : ''}</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px">🍽️ Choisir une <span style="color:var(--accent)">table</span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">Touchez une table pour prendre la commande</div>
      </div>
      <div id="plan-scroll" style="--plan-ar:${maxX+60}/${maxY+60};overflow:hidden;-webkit-overflow-scrolling:touch;position:relative;min-height:0;touch-action:none">
        <div id="plan-wrapper" style="position:relative;width:100%;height:100%;overflow:hidden">
          <div id="plan-inner" style="position:absolute;width:${maxX+60}px;height:${maxY+60}px;transform-origin:top left;left:0;top:0">
            ${elHtml}
          </div>
        </div>
        <div id="plan-hint" style="position:absolute;bottom:8px;right:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:5px 9px;border-radius:8px;pointer-events:none">Pincer pour zoomer · toucher deux fois pour recadrer</div>
      </div>
      <div id="table-quick">${elements.map((el,idx)=>({el,idx})).filter(o=>isTable(o.el)).sort((a,b)=>String(a.el.number??'').localeCompare(String(b.el.number??''),'fr',{numeric:true})).map(o=>`<button type="button" class="tq-btn${cartCountFor(String(o.el.id ?? ''))?' has-cart':''}" data-tidx="${o.idx}">${escHtml(o.el.number||'')}</button>`).join('')}</div>
    </div>`;
  picker.style.display='flex';
  // « Rester sur cette table » : même effet qu'un toucher sur sa propre table
  const stay = document.getElementById('tp-stay');
  if(stay) stay.addEventListener('click', () => pickTable(tableId, tableNum));
  // Délégation : choix de table par index (jamais de donnée dans un onclick).
  // Sur #tp-root pour couvrir le plan ET la grille de boutons (portrait) ;
  // l'écouteur en capture de #plan-scroll stoppe toujours pan et double-tap avant.
  document.getElementById('tp-root').addEventListener('click', (e) => {
    const t = e.target.closest('[data-tidx]');
    if(!t) return;
    const el = elements[parseInt(t.dataset.tidx, 10)];
    if(!el || (el.type !== 'table-round' && el.type !== 'table-rect')) return;
    pickTable(String(el.id ?? ''), String(el.number ?? ''));
  });
  // Pinch-zoom + pan + double-tap reset
  const planW = maxX + 60, planH = maxY + 60;
  const view = { scale:1, tx:0, ty:0 };
  const apply = ()=>{ const inner=document.getElementById('plan-inner'); if(!inner) return; inner.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.scale})`; };
  const fit = ()=>{
    const wrap=document.getElementById('plan-scroll'); if(!wrap) return;
    const aw=wrap.clientWidth, ah=wrap.clientHeight;
    if(aw<50||ah<50) return;
    view.scale = Math.min(1, aw/planW, ah/planH); view.tx=0; view.ty=0;
    apply();
  };
  fit();
  if(window._planResizeHandler) window.removeEventListener('resize', window._planResizeHandler);
  window._planResizeHandler = fit;
  window.addEventListener('resize', fit);
  // Gestures tactiles
  const wrap = document.getElementById('plan-scroll');
  const pointers = new Map();
  let pinchStart=null, panStart=null, lastTap=0;
  const minS=0.3, maxS=4;
  const pos = (e)=>{ const r=wrap.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  wrap.addEventListener('pointerdown',(e)=>{
    // Skip mouse : clics natifs vers tables.
    if(e.pointerType === 'mouse') return;
    pointers.set(e.pointerId, pos(e)); wrap.setPointerCapture(e.pointerId);
    if(pointers.size===2){
      const p=Array.from(pointers.values()); const dx=p[1].x-p[0].x,dy=p[1].y-p[0].y;
      pinchStart={dist:Math.hypot(dx,dy), scale:view.scale, midX:(p[0].x+p[1].x)/2, midY:(p[0].y+p[1].y)/2, tx:view.tx, ty:view.ty};
      panStart=null;
    } else if(pointers.size===1){
      panStart={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false};
    }
  });
  wrap.addEventListener('pointermove',(e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, pos(e));
    if(pointers.size===2 && pinchStart){
      const p=Array.from(pointers.values()); const dx=p[1].x-p[0].x,dy=p[1].y-p[0].y;
      const dist=Math.hypot(dx,dy); const ratio=dist/pinchStart.dist;
      const ns=Math.max(minS,Math.min(maxS,pinchStart.scale*ratio));
      const k=ns/pinchStart.scale;
      view.scale=ns; view.tx=pinchStart.midX-k*(pinchStart.midX-pinchStart.tx); view.ty=pinchStart.midY-k*(pinchStart.midY-pinchStart.ty);
      apply(); e.preventDefault();
    } else if(pointers.size===1 && panStart){
      const dx=e.clientX-panStart.x, dy=e.clientY-panStart.y;
      if(Math.abs(dx)>4||Math.abs(dy)>4) panStart.moved=true;
      if(panStart.moved){ view.tx=panStart.tx+dx; view.ty=panStart.ty+dy; apply(); e.preventDefault(); }
    }
  });
  const endP=(e)=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinchStart=null; if(pointers.size===0) panStart=null; };
  wrap.addEventListener('pointerup',endP); wrap.addEventListener('pointercancel',endP);
  wrap.addEventListener('click',(e)=>{
    if(panStart && panStart.moved){ e.stopPropagation(); return; }
    const now=Date.now();
    if(now-lastTap<300){ fit(); e.stopPropagation(); }
    lastTap=now;
  }, true);
  wrap.addEventListener('wheel',(e)=>{
    e.preventDefault(); const p=pos(e);
    const factor=e.deltaY<0?1.1:0.9;
    const ns=Math.max(minS,Math.min(maxS,view.scale*factor));
    const k=ns/view.scale;
    view.tx=p.x-k*(p.x-view.tx); view.ty=p.y-k*(p.y-view.ty); view.scale=ns;
    apply();
  },{passive:false});
}

function pickTable(id, num){
  saveCart(); // range le panier de la table quittée (no-op si aucune)
  tableId = String(id || '').slice(0, 40);
  tableNum = String(num || '').slice(0, 20);
  restoreCart(); // reprend le panier de la table choisie
  updateTableDisplay();
  updateCartBar();
  document.getElementById('table-picker').style.display='none';
  document.getElementById('app').style.display='flex';
  renderMenu();
}

// Changer de table : le panier en cours reste rangé sous sa table (rien n'est
// perdu). Bloqué seulement pendant un envoi (10 s max avant reprise de main).
function changeTable(){
  if(_orderInFlight){
    showServeurNotif('⏳ Envoi en cours — patiente quelques secondes');
    return;
  }
  saveCart();
  document.getElementById('app').style.display='none';
  showTablePicker();
}

window.pickTable = pickTable;
window.changeTable = changeTable;

// Load images from Firebase (batched)
async function loadImages(batchCount){
  for(let i=0; i<batchCount; i++){
    try{
      const snap = await getDoc(doc(db, 'config', 'images_'+i));
      if(snap.exists()){
        const data = snap.data();
        if(data.images) Object.assign(productImages, data.images);
      }
    }catch(e){ console.warn('Image batch '+i+' load error:', e); }
  }
  renderMenu();
}

// Plus de PIN serveur (retiré le 19/11 : 0000 par défaut = pas de PIN, et
// « PIN oublié ? » le contournait). La protection = appareil enregistré
// (requireStaff ci-dessus). L'app s'ouvre dès que la carte est chargée.
let _appStarted = false;

// Load menu
onSnapshot(doc(db, 'config', 'menu'), snap => {
  if(snap.exists()){
    menu = snap.data();
    const b = menu.branding||{};
    if(b.name) { const safe = escHtml(b.name); document.getElementById('resto-name').innerHTML = safe.replace(/(\S+)$/, '<span style="color:var(--accent)">$1</span>'); document.title = b.name + ' — Serveur'; }
    const accent = safeColor(b.accent);

  }
});

// Ouverture de l'app au premier chargement de la carte (plus d'écran PIN)
function startApp(){
  _appStarted = true;
  document.getElementById('loading').style.display='none';
  // Table déjà fixée (URL) → carte directe, sinon plan de salle
  if(tableNum && tableId){
    document.getElementById('app').style.display='flex';

  }

// Permission de notification : demandée au premier toucher (geste utilisateur,
// exigé par Safari/Firefox) puisqu'il n'y a plus de saisie de PIN.
document.addEventListener('click', () => {
  try {
    if('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  } catch(_){}
}, { once: true, capture: true });

// ── Order notifications (kitchen → serveur) ──
let knownReadyOrders = new Set();
let orderListenerStarted = false;
let _firstOrderSnapshot = true; // Audit #5 : skip notif au hydration initial

// Audit serveur #3 : AudioContext SINGLETON (avant : new AudioContext() à
// chaque showServeurNotif → leak mémoire, Chrome limite à 6 contexts → audio
// mort mi-service). Lazy-init au premier appel.
let _serveurAudioCtx = null;

function startOrderNotifications(){
  if(orderListenerStarted) return;
  orderListenerStarted = true;

  // Audit serveur #12 : la permission de notification est demandée au premier
  // toucher (listener 'click' once plus haut), plus ici (pas de geste utilisateur).

  // Audit serveur #4 : query Firestore strict — status='ready' uniquement.
  // Avant : onSnapshot collection complet → lecture de TOUS les orders à chaque
  // snapshot (cost FB + fuite cross-tenant si rules trop ouvertes). Maintenant :
  // filtre serveur, ne reçoit que les orders concernés.
  // Note : pas de filtre date côté Firestore pour rester simple (les rules /
  // une cleanup périodique gèrent l'ancien). Le _firstOrderSnapshot évite
  // les notifs au hydration des orders du jour.
  const readyOrdersQuery = query(
    collection(db, 'orders'),
    where('status', '==', 'ready')
  );

  onSnapshot(readyOrdersQuery, snap => {
    const seenIds = new Set();
    snap.forEach(d => {
      const order = d.data();
      const id = d.id;
      seenIds.add(id);
      if(!knownReadyOrders.has(id)){
        knownReadyOrders.add(id);
        // Audit #5 : skip notif au PREMIER snapshot (hydration). Avant : bug
        // logique avec `|| orderListenerStarted` qui était toujours true →
        // le serveur entendait "Commande prête !" pour les orders de la veille
        // à chaque refresh page.
        if(!_firstOrderSnapshot){
          const tNum = order.tableNum || order.tableId || '?';
          showServeurNotif('🟢 Commande prête — Table '+tNum);
          // try : `Notification` absent (Safari iOS hors PWA) ou constructeur
          // interdit (Chrome Android) ne doit pas casser le traitement du snapshot.
          try {
            if('Notification' in window && Notification.permission === 'granted'){
              const n = new Notification('Commande prête !', {
                body: 'Table '+tNum+' — à servir',
                icon: 'icon-192.png',
                tag: 'serveur-ready-'+id, // évite doublons
                renotify: false
              });
              setTimeout(() => { try { n.close(); } catch(e){} }, 8000);
            }
          } catch(e){ /* toast + son déjà joués */ }
        }
      }
    });
    // Audit #11 : reset les IDs qui ne sont plus 'ready' (servis, annulés,
    // ou repassés à 'preparing' par correction cuisinier). Avant : un order
    // qui re-passait à 'ready' après correction ne re-notifiait jamais.
    knownReadyOrders.forEach(id => {
      if(!seenIds.has(id)) knownReadyOrders.delete(id);
    });
    _firstOrderSnapshot = false;
  }, err => {
    console.warn('[serveur] écoute « commande prête » :', err && (err.code || err.message));
  });
}
// Écoute « commande prête » démarrée dès le chargement (avant : après le PIN)
startOrderNotifications();

function showServeurNotif(msg){
  // Audit serveur #3 : singleton audioCtx.
  try{
    if(!_serveurAudioCtx) _serveurAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _serveurAudioCtx;
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.setValueAtTime(660, ctx.currentTime);
    o.frequency.setValueAtTime(880, ctx.currentTime+0.1);
    o.frequency.setValueAtTime(1100, ctx.currentTime+0.2);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
    o.start(ctx.currentTime); o.stop(ctx.currentTime+0.4);
  }catch(e){ console.warn('[serveur] audio fail:', e.message); }
  // Visual toast
  let t = document.getElementById('serveur-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'serveur-toast';
    t.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-10px);padding:12px 20px;border-radius:14px;font-weight:700;font-size:13px;z-index:1000;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5);background:var(--green);color:#000;opacity:0;transition:all .25s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(-10px)'; }, 4000);
}

function renderMenu(){
  if(!menu) return;
  const tabs = document.getElementById('menu-tabs');
  const content = document.getElementById('menu-content');
  const cats = menu.cats||[];
  if(!cats.length) return;

  let activeCat = tabs.dataset.active || String(cats[0]?.id ?? '');
  // Catégories Firestore : échappées, data-cat + délégation (plus d'onclick construit)
  tabs.innerHTML = cats.map(c=>{
    const cid = String(c.id ?? '');
    return `
    <button class="mtab${activeCat===cid?' active':''}" data-cat="${escHtml(cid)}">
      ${escHtml(c.icon||'')} ${escHtml(c.name||'')}
    </button>`;
  }).join('');
  tabs.dataset.active = activeCat;

  const prods = (menu.products||[]).filter(p=>String(p.cat ?? '')===activeCat);
  const sections = [];
  prods.forEach(p=>{
    const sec = p.section||'';
    let s = sections.find(x=>x.name===sec);
    if(!s){ s={name:sec,items:[]}; sections.push(s); }
    s.items.push(p);
  });

  let html='';
  sections.forEach(sec=>{
    if(sec.name) html+=`<div class="sec-sep">${escHtml(String(sec.name).toUpperCase())}</div>`;
    sec.items.forEach(p=>{
      const inCart = cart.filter(r=>r.pid===p.id).reduce((s,r)=>s+r.qty,0);
      const img = safeUrl(optImg(p.imgUrl || productImages[p.id] || null, 'thumb'));
      // Audit serveur #1 : XSS — escHtml partout sur les contenus produits dérivés de Firebase.
      // Avant : ${p.name} brut → admin malicieux qui tape "<scr"+"ipt>alert(1)" en nom
      // de produit exécutait du JS sur la tablette serveur. Idem alt="${p.name}" (XSS via
      // <img onerror=...> si name = '"><img onerror=...>').
      const safeName = escHtml(p.name);
      const safeSub = /^\s*ex\s*:/i.test(p.sub || '') ? '' : escHtml(p.sub || '');   // « Ex : … » = texte d'exemple
      const imgHtml = img
        ? `<div class="prod-img"><img src="${escHtml(img)}" alt="${safeName}" loading="lazy"></div>`
        : '';
      const outOfStock = p.stock!==undefined && p.stock>=0 && p.stock===0;
      const pidAttr = escHtml(p.id);
      const optHint = [variantsOf(p).length?'📏 Taille':'', p.hasCuisson?'🔥 Cuisson':'', p.hasGarniture?'🍟 Garniture':''].filter(Boolean).join(' · ');
      html+=`<div class="prod-card${img?' has-img':''}${outOfStock?' sold-out':''}">
        ${imgHtml}
        <div class="prod-info">
          <div class="prod-name">${p.pdj?'⭐ ':''}${safeName}</div>
          ${safeSub?`<div class="prod-sub">${safeSub}</div>`:''}
          ${optHint?`<div style="font-size:10px;color:var(--accent);font-weight:600;margin-top:2px">${optHint}</div>`:''}
          <div class="prod-price">${priceLabel(p)}</div>
        </div>
        <div class="prod-actions">
          ${outOfStock ? `<span style="font-size:12px;font-weight:700;color:var(--red);background:rgba(232,64,64,.1);padding:6px 14px;border-radius:20px">Épuisé</span>` :
            inCart ? `
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent)">${inCart} dans le panier</span>
              <button class="add-btn" data-add-pid="${pidAttr}">+</button>
            </div>` :
            `<button class="add-btn" data-add-pid="${pidAttr}">+ Ajouter</button>`
          }
        </div>
      </div>`;
    });
  });
  content.innerHTML = html||'<div style="padding:30px;text-align:center;color:#888">Aucun article</div>';
}

// Ligne de panier = {pid, name, price, qty, tva, cuisson, garniture, cat, variant, sirop}
// (même identité de ligne que la caisse : pid + variante + cuisson + garniture + sirop).
// Prix recalculé depuis le menu (variante / sirop) — la caisse le recalcule aussi.
function makeLine(p, opts){
  const o = opts || {};
  const variant = variantsOf(p).some(v => v.label === o.variant) ? o.variant : null;
  const sirop = !!(o.sirop && p.hasSirop);
  return {
    pid: p.id,
    name: String(p.name || '') + (variant ? ' — ' + variant : ''),
    price: unitPrice(p, variant, sirop),
    tva: Number(p.tva) || 10,
    cuisson: o.cuisson || null,
    garniture: o.garniture || null,
    cat: p.cat || null,
    variant,
    sirop
  };
}
function changeQty(line, delta){
  const key = lineKey(line);
  const ex = cart.find(r => lineKey(r) === key);
  if(ex){ ex.qty+=delta; if(ex.qty<=0) cart=cart.filter(r=>r!==ex); }
  else if(delta>0) cart.push({...line, qty:1});
  cartChanged();
  updateCartBar();
  renderMenu();
}

let pendingOptProduct = null;

function addProduct(pid){
  const p = (menu?.products||[]).find(x=>x.id===pid);
  if(!p) return;
  // Bloque l'ajout UNIQUEMENT si le produit est explicitement épuisé (stock === 0).
  // ⚠ La caisse sérialise stock:-1 pour les produits SANS gestion de stock
  // (marmite-express-caisse.html : p.stock===undefined?-1:p.stock). Tester
  // `<= 0` attrapait ce -1 sentinelle et bloquait l'ajout de TOUS les produits
  // non gérés en stock. `=== 0` strict = cohérent avec l'affichage outOfStock
  // et avec client.html.
  if(p.stock === 0){
    showServeurNotif('🚫 ' + String(p.name || '') + ' est épuisé — informe le client');
    return;
  }
  // Variante (obligatoire si hasVariant), cuisson, garniture ou sirop → modale
  if(needsOptions(p)){
    openOptionsModal(p);
    return;
  }
  changeQty(makeLine(p), 1);
}

// Délégation : boutons « + Ajouter » (data-add-pid) et onglets (data-cat)
document.getElementById('menu-content').addEventListener('click', (e) => {
  const b = e.target.closest('[data-add-pid]');
  if(b) addProduct(b.dataset.addPid);
});
document.getElementById('menu-tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cat]');
  if(b) switchTab(b.dataset.cat);
});

// Modale d'options : variante (obligatoire si hasVariant), cuisson, garniture,
// supplément sirop. Texte du menu échappé ; les chips portent un index
// (data-idx) vers les listes ci-dessous, jamais la valeur dans un onclick.
let _optLists = { variant: [], cuisson: [], garniture: [] };
const _optLabel = 'font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:8px';
function optGroup(id, title, labels){
  return `<div style="margin-bottom:16px">
      <div style="${_optLabel}">${title}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px" id="${id}">
        ${labels.map((l,i)=>`<button type="button" class="opt-chip${i===0?' sel':''}" data-idx="${i}" onclick="selChip(this)">${escHtml(l)}</button>`).join('')}
      </div>
    </div>`;
}
function openOptionsModal(p){
  pendingOptProduct = p;
  const opts = menu.options||{};
  const strs = (a) => (Array.isArray(a) ? a : []).filter(x => typeof x === 'string' && x);
  const variants = variantsOf(p);
  _optLists = {
    variant: variants.map(v => v.label),
    cuisson: p.hasCuisson ? strs(opts.cuissons) : [],
    garniture: p.hasGarniture ? strs(opts.garnitures) : []
  };
  let html = `<div style="font-size:16px;font-weight:700;margin-bottom:16px">${escHtml(p.name)}</div>`;
  if(variants.length){
    html += optGroup('opt-variant-btns', '📏 Taille', variants.map(v => v.label + ' — ' + fmtEur(v.price) + '€'));
  }
  if(_optLists.cuisson.length) html += optGroup('opt-cuisson-btns', '🔥 Cuisson', _optLists.cuisson);
  if(_optLists.garniture.length) html += optGroup('opt-garniture-btns', '🍟 Garniture', _optLists.garniture);
  if(p.hasSirop){
    html+=`<div style="margin-bottom:16px">
      <div style="${_optLabel}">🍯 Supplément</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px" id="opt-sirop-btns">
        <button type="button" class="opt-chip sel" data-sirop="0" onclick="selChip(this)">Sans sirop</button>
        <button type="button" class="opt-chip" data-sirop="1" onclick="selChip(this)">+ Sirop (+0,50€)</button>
      </div>
    </div>`;
  }
  html+=`<div style="display:flex;gap:8px;margin-top:8px">
    <button onclick="closeOptModal()" style="flex:1;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer">Annuler</button>
    <button onclick="confirmOpt()" style="flex:1;height:44px;border-radius:12px;background:var(--accent);border:none;color:#000;font-weight:800;font-size:14px;cursor:pointer">✓ Ajouter</button>
  </div>`;
  document.getElementById('opt-modal-body').innerHTML = html;
  document.getElementById('opt-modal').style.display = 'flex';
}

function selChip(el){
  el.parentElement.querySelectorAll('.opt-chip').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}

function confirmOpt(){
  if(!pendingOptProduct) return;
  const p = pendingOptProduct;
  const pick = (group) => {
    const el = document.querySelector('#opt-'+group+'-btns .opt-chip.sel');
    const i = el ? parseInt(el.dataset.idx, 10) : -1;
    return (i >= 0 && i < _optLists[group].length) ? _optLists[group][i] : null;
  };
  const variant = pick('variant');
  if(_optLists.variant.length && !variant){ showServeurNotif('Choisis une taille'); return; }
  const siropEl = document.querySelector('#opt-sirop-btns .opt-chip.sel');
  changeQty(makeLine(p, {
    variant,
    cuisson: pick('cuisson'),
    garniture: pick('garniture'),
    sirop: !!(siropEl && siropEl.dataset.sirop === '1')
  }), 1);
  closeOptModal();
}

function closeOptModal(){
  document.getElementById('opt-modal').style.display = 'none';
  pendingOptProduct = null;
}

function updateCartBar(){
  const count = cart.reduce((s,r)=>s+r.qty,0);
  const total = cart.reduce((s,r)=>s+r.qty*r.price,0);
  const bar = document.getElementById('cart-bar');
  bar.style.display = count ? 'flex' : 'none';
  document.getElementById('cart-count').textContent = count+' article'+(count>1?'s':'');
  document.getElementById('cart-total-bar').textContent = total.toFixed(2).replace('.',',')+'€';
}

function switchTab(id){
  const tabs=document.getElementById('menu-tabs');
  tabs.dataset.active=id;
  renderMenu();
}

function openCartPanel(){
  const panel = document.getElementById('cart-panel');
  panel.style.display='flex';
  document.body.classList.add('cart-open');   // barre orange masquée derrière le volet (tablette)
  document.getElementById('cp-error').style.display='none';

function closeCartPanel(){ document.getElementById('cart-panel').style.display='none'; document.body.classList.remove('cart-open'); }

function renderCartPanel(){
  const total = cart.reduce((s,r)=>s+(Number(r.qty)||0)*(Number(r.price)||0),0);
  document.getElementById('cp-items').innerHTML = cart.map((r, idx)=>{
    // Audit serveur #1 : escHtml sur le contenu ; boutons +/- par index (data-cart-idx)
    // + délégation, plus aucune donnée dans un onclick.
    const safeName = escHtml(r.name);
    const optTxt = [r.cuisson, r.garniture, r.sirop ? '+ sirop' : ''].filter(Boolean).map(escHtml).join(' · ');
    const price = Number(r.price) || 0;
    const qty = Number(r.qty) || 0;
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)">
      <div style="flex:1;min-width:0;overflow-wrap:break-word">
        <div style="font-size:15px;font-weight:600">${safeName}</div>
        ${optTxt?`<div style="font-size:11px;color:var(--accent);font-weight:600;margin-top:2px">${optTxt}</div>`:''}
        <div style="font-size:12px;color:#888">${fmtEur(price)}€/u</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="cp-qty cp-minus" data-cart-idx="${idx}" data-cart-delta="-1" aria-label="Diminuer la quantité">−</button>
        <span style="font-family:'Bebas Neue',sans-serif;font-size:22px">${qty}</span>
        <button class="cp-qty cp-plus" data-cart-idx="${idx}" data-cart-delta="1" aria-label="Augmenter la quantité">+</button>
      </div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:#22c97a;min-width:56px;text-align:right">${(qty*price).toFixed(2).replace('.',',')}€</div>
    </div>`;
  }).join('');
  document.getElementById('cp-total').textContent = total.toFixed(2).replace('.',',')+'€';
  document.getElementById('cp-send').disabled = !cart.length;
}

// Délégation pour les boutons +/- du panier
document.getElementById('cp-items').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-cart-idx]');
  if(!btn) return;
  const r = cart[parseInt(btn.dataset.cartIdx, 10)];
  const delta = parseInt(btn.dataset.cartDelta, 10);
  if(!r || (delta !== 1 && delta !== -1)) return;
  changeQty(r, delta);
  renderCartPanel();
});

async function sendOrder(){
  if(!cart.length) return;

  // Audit serveur #6 : lock anti-double-envoi. Avant : si le timeout 10s
  // re-enable le bouton et Firebase finit par accepter le premier addDoc,
  // re-cliquer = DEUX orders pour la même table.
  if(_orderInFlight){
    console.warn('[sendOrder] Already in flight, skipping double-click');
    return;
  }

  // Audit serveur #2 : guard table sélectionnée. Avant : on pouvait pousser
  // un order avec tableId=null → cuisine affiche "Table ?".
  if(!tableId || !tableNum){
    const errEl = document.getElementById('cp-error');
    errEl.textContent = '⚠️ Sélectionnez d\'abord une table.';
    errEl.style.display='block';
    return;
  }

  // Audit serveur #10 : validation cart vs menu actuel. Le menu peut avoir
  // changé pendant la prise de commande (prix, variante, produit retiré).
  // Prix attendu = même calcul que la caisse (variante + sirop).
  if(menu && Array.isArray(menu.products)){
    const productsMap = new Map(menu.products.map(p => [p.id, p]));
    const warnings = [];
    const validCart = [];
    cart.forEach(r => {
      const p = productsMap.get(r.pid);
      if(!p){
        warnings.push(`• "${r.name}" — produit retiré de la carte (item retiré)`);
        return; // skip
      }
      if(p.active === false){
        warnings.push(`• "${r.name}" — produit désactivé (item retiré)`);
        return;
      }
      const vs = variantsOf(p);
      if(vs.length && !vs.some(v => v.label === r.variant)){
        warnings.push(`• "${r.name}" — taille plus proposée (item retiré)`);
        return;
      }
      const newPrice = unitPrice(p, r.variant, r.sirop);
      const oldPrice = Number(r.price) || 0;
      if(Math.abs(newPrice - oldPrice) > 0.001){
        warnings.push(`• "${r.name}" — prix changé : ${oldPrice.toFixed(2)}€ → ${newPrice.toFixed(2)}€`);
        validCart.push({...r, price: newPrice}); // utilise prix actuel
      } else {
        validCart.push(r);
      }
    });
    if(warnings.length){
      const msg = 'Modifications détectées sur la carte :\n\n' + warnings.join('\n') + '\n\nEnvoyer la commande avec les corrections ?';
      cart = validCart;
      cartChanged();
      if(!confirm(msg)){
        // L'utilisateur refuse → on rafraîchit le cart pour qu'il revoie
        updateCartBar();
        renderCartPanel();
        return;
      }
      if(!cart.length){
        const errEl = document.getElementById('cp-error');
        errEl.textContent = 'Tous les items ont été retirés (carte modifiée). Recommandez.';
        errEl.style.display='block';
        updateCartBar();
        return;
      }
    }
  }

  _orderInFlight = true;
  const btn = document.getElementById('cp-send');
  btn.disabled=true; btn.textContent='⏳ Envoi en cours...';

  // Idempotence : id généré côté client et conservé jusqu'au succès. Un nouvel
  // essai (réseau perdu, timeout) réutilise le MÊME id → jamais de doublon.
  const isRetry = !!_pendingOrderRef;
  if(!_pendingOrderRef) _pendingOrderRef = doc(collection(db,'orders'));
  const ref = _pendingOrderRef;
  // Même id = même commande (le ref peut être recréé depuis le panier sauvegardé)
  const sameRef = (r) => !!r && r.id === ref.id;
  saveCart(); // id en attente persisté avec le panier de la table

  // Contenu figé AVANT toute attente : la table et le panier envoyés sont ceux
  // du clic, même si la serveuse change de table pendant un envoi lent.
  const sendTableId = tableId;
  const sendTableNum = tableNum;
  const orderData = {
    tableId: String(sendTableId),
    tableNum: String(sendTableNum),
    items: cart.map(r=>({
      pid: r.pid,
      name: r.name,
      price: Number(r.price) || 0,
      qty: Number(r.qty) || 0,
      tva: Number(r.tva) || 10,
      cuisson: r.cuisson || null,
      garniture: r.garniture || null,
      cat: r.cat || null,
      variant: r.variant || null,
      sirop: !!r.sirop
    })),
    note: String(document.getElementById('cp-note')?.value||'').slice(0, 500),
    status: 'pending',
    // Audit serveur #7 : source='serveur' (la cuisine distingue serveur / client QR)
    source: 'serveur'
  };

  // Réseau lent / hors ligne : le SDK garde l'écriture en file et la rejouera.
  // Après 10 s on rend la main : réessayer réécrit le même document.
  const timeoutId = setTimeout(()=>{
    if(!sameRef(_pendingOrderRef)) return;
    _orderInFlight = false;
    btn.disabled = !cart.length;
    btn.textContent = '✅ Réessayer (sans doublon)';
    document.getElementById('cp-error').textContent='⚠️ Réseau lent — la commande partira dès le retour du réseau. Réessayer ne crée pas de doublon.';
    document.getElementById('cp-error').style.display='block';
  }, 10000);

  try{
    // Nouvel essai : si le 1er envoi est en fait arrivé, on ne le réécrit pas
    // (la cuisine a pu le faire avancer entre-temps).
    let already = false;
    if(isRetry){
      try { already = (await getDocFromServer(ref)).exists(); } catch(_) { /* hors ligne → setDoc mis en file */ }
    }
    if(!already){
      await setDoc(ref, { ...orderData, sentAt: serverTimestamp() });
    }
    clearTimeout(timeoutId);
    if(tableId !== sendTableId){
      // Table changée pendant l'envoi (après reprise de main) : on vide le panier
      // de la table d'origine seulement s'il n'a pas été modifié depuis.
      const e = cartsByTable[sendTableId];
      if(e && e.pendingId === ref.id){
        delete cartsByTable[sendTableId];
        persistCarts();
        showServeurNotif('✓ Commande table ' + sendTableNum + ' bien reçue');
      } else {
        showServeurNotif('✓ Commande précédente table ' + sendTableNum + ' bien reçue — vérifie son panier');
      }
      return;
    }
    if(!sameRef(_pendingOrderRef)){ // panier modifié entre-temps : le 1er envoi est quand même arrivé
      showServeurNotif('✓ Commande précédente bien reçue — vérifie le panier avant de renvoyer');
      return;
    }
    _pendingOrderRef = null;
    cart=[];
    // Vide la note pour éviter qu'elle ne "fuite" sur la commande suivante
    // (ex: "sans oignon" écrit pour la table 5 ne doit pas rester pour la 12)
    const noteEl = document.getElementById('cp-note');
    if(noteEl) noteEl.value = '';
    saveCart(); // panier vide → entrée de la table supprimée (et persistée)
    const errEl = document.getElementById('cp-error');
    if(errEl) errEl.style.display = 'none';
    updateCartBar();
    closeCartPanel();
    showConfirmation();
  }catch(e){
    clearTimeout(timeoutId);
    const errEl = document.getElementById('cp-error');
    errEl.textContent = '❌ Erreur : '+(e && (e.code || e.message))+'. Réessayer ne crée pas de doublon.';
    errEl.style.display='block';
    console.error('Firebase error:',e);
  } finally {
    if(!_pendingOrderRef || sameRef(_pendingOrderRef)){
      _orderInFlight = false;
      btn.disabled = !cart.length;
      btn.textContent = '✅ Confirmer la commande';
    }
  }
}

function showConfirmation(){
  document.getElementById('confirm-screen').style.display='flex';
  setTimeout(()=>{
    document.getElementById('confirm-screen').style.display='none';
    renderMenu();
  }, 3000);
}

window.switchTab=switchTab; window.changeQty=changeQty; window.addProduct=addProduct;
window.openCartPanel=openCartPanel; window.closeCartPanel=closeCartPanel;
window.renderCartPanel=renderCartPanel; window.sendOrder=sendOrder;
window.selChip=selChip; window.confirmOpt=confirmOpt; window.closeOptModal=closeOptModal;
</script>

<style>
html{height:100%;height:100dvh}
body{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
#app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
/* display:flex + gap : remplace les espaces autour du numéro et du ✎ (supprimés en bout d'élément flex) */
.table-pill{background:var(--accent);color:#000;font-family:'Bebas Neue',sans-serif;font-size:18px;padding:4px 14px;border-radius:20px;letter-spacing:1px;flex-shrink:0;white-space:nowrap;min-height:44px;display:flex;align-items:center;gap:6px}
#resto-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px}
.tagline{font-size:10px;color:var(--muted);font-weight:700}
/* Le lien SERVEUR est l'élément flex : il ne doit pas rétrécir (sinon la pastille se casse en deux) */
#app-header>a{flex-shrink:0}
#table-pill-num{font-size:22px;padding:4px 18px}
.hdr-brand{flex:1;min-width:0}
#resto-name,.tagline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Téléphone : nom écrit masqué (il ne tiendrait qu'en « LA MA… »), logo calé à droite s'il est configuré */
@media (max-width:480px){.hdr-brand{display:none}#resto-logo{margin-left:auto}}

/* Main app */
#app{flex:1;display:none;flex-direction:column;overflow:hidden;min-height:0}
#loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}

/* Tabs */
#menu-tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none}
#menu-tabs::-webkit-scrollbar{display:none}
.mtab{height:36px;padding:0 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0}
.mtab.active{background:rgba(245,166,35,.15);border-color:var(--accent);color:var(--accent)}

/* Products */
#menu-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:110px;min-height:0}
/* Pas de border-top : le trait vient de la bordure basse de #menu-tabs ou de la .prod-card précédente (évite le double trait) */
.sec-sep{padding:8px 16px;font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--muted);background:rgba(255,255,255,.02)}
.prod-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.prod-card.sold-out{opacity:.5}
.prod-img{width:64px;height:64px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--card)}
.prod-img img{width:100%;height:100%;object-fit:cover;display:block}
.prod-info{flex:1}
.prod-name{font-size:15px;font-weight:600;margin-bottom:2px}
.prod-sub{font-size:12px;color:var(--muted);margin-bottom:6px;line-height:1.4}
.prod-price{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--green)}
.prod-actions{flex-shrink:0}
.add-btn{height:36px;padding:0 16px;border-radius:20px;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.3);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.add-btn:active{background:rgba(245,166,35,.3)}
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-ctrl button{width:32px;height:32px;border-radius:50%;border:none;font-size:18px;font-weight:700;cursor:pointer}
.qty-ctrl button:first-child{background:rgba(232,64,64,.12);color:var(--red)}
.qty-ctrl button:last-child{background:rgba(34,201,122,.12);color:var(--green)}
.qty-ctrl span{font-family:'Bebas Neue',sans-serif;font-size:22px;min-width:24px;text-align:center}
/* Tablette paysage / grand écran : 2 colonnes au lieu de lignes étirées sur toute la largeur */
@media (min-width:1000px){
  #menu-content{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
  #menu-content>:not(.prod-card){grid-column:1/-1}
  .prod-card{border-right:1px solid var(--border)}
}

/* Cart bar */
/* Padding latéral : contenu regroupé sur 600 px au centre sur tablette, 20 px comme avant sur téléphone */
#cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--accent);padding:14px max(20px,calc(50% - 300px)) calc(14px + env(safe-area-inset-bottom));gap:12px;display:none;align-items:center;justify-content:space-between;cursor:pointer;z-index:40}
#cart-count{font-size:14px;font-weight:700;color:#000}
#cart-total-bar{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#000}
.cart-arrow{font-size:14px;font-weight:800;color:#000;white-space:nowrap}

/* Cart panel */
#cart-panel{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:flex-end}
body.cart-open #cart-bar{visibility:hidden}
.cart-inner{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:640px;margin:0 auto;max-height:88dvh;display:flex;flex-direction:column}
.cp-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:12px auto 4px;flex-shrink:0}
.cp-header{padding:10px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.cp-header h3{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px}
.cp-close{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:16px;cursor:pointer}
/* Boutons − / + du panier : 44 px, signe épais et contrasté */
.cp-qty{width:44px;height:44px;padding:0;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;line-height:1;flex-shrink:0;cursor:pointer}
.cp-minus{background:rgba(232,64,64,.18);color:#ff6b6b}
.cp-plus{background:rgba(34,201,122,.18);color:var(--green)}
#cp-items{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px;min-height:0}
.cp-footer{padding:14px 16px;border-top:1px solid var(--border)}
#cp-note{width:100%;height:50px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text);resize:none;margin-bottom:10px;font-family:'DM Sans',sans-serif}
#cp-note:focus{border-color:var(--accent);outline:none}
.cp-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cp-total-lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#cp-total{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--green)}
#cp-send{width:100%;height:54px;border-radius:var(--radius);background:var(--accent);color:#000;font-size:16px;font-weight:800;cursor:pointer;border:none;letter-spacing:.5px;transition:opacity .15s}
#cp-send:disabled{opacity:.4;cursor:not-allowed}

/* Confirmation screen */
#confirm-screen{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.confirm-icon{font-size:72px;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.confirm-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;color:var(--green)}
.confirm-sub{font-size:14px;color:var(--muted);text-align:center;line-height:1.6}

/* Options modal */
#opt-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:150;display:none;align-items:center;justify-content:center;padding:16px}
#opt-modal-inner{background:var(--surface);border-radius:20px;width:100%;max-width:360px;padding:20px;border:1px solid var(--border);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto}
.opt-chip{height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1.5px solid var(--border);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.opt-chip:active{transform:scale(.95)}
.opt-chip.sel{border-color:var(--accent);background:rgba(245,166,35,.12);color:var(--accent)}

/* Choix de table : marges de sécurité iPhone (0 ailleurs) + sortie Accueil / Rester sur la table */
#table-picker{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tp-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tp-back,.tp-stay{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;border-radius:22px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap;cursor:pointer}
.tp-back{background:var(--card);border:1px solid var(--border);color:var(--muted)}
.tp-stay{background:rgba(245,166,35,.15);border:1px solid var(--accent);color:var(--accent)}

/* Plan de salle : pleine hauteur en paysage ; en portrait, plan à sa proportion
   (repère) + grille de gros boutons triés par numéro, utilisables d'une main */
#plan-scroll{flex:1}
#table-quick{display:none}
@media (orientation:portrait){
  #plan-scroll{flex:0 0 auto;width:100%;aspect-ratio:var(--plan-ar);max-height:55%}
  #plan-hint{display:none}
  #table-quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;align-content:start;flex:1;min-height:0;overflow-y:auto;padding:12px 16px 16px;border-top:1px solid var(--border)}
  .tq-btn{height:56px;border-radius:14px;background:rgba(34,201,122,.1);border:2px solid #22c97a;color:#22c97a;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px}
  .tq-btn.has-cart{border-color:var(--accent);color:var(--accent);background:rgba(245,166,35,.12)}
  .tq-btn:active{background:rgba(245,166,35,.2);border-color:var(--accent);color:var(--accent)}
}

</style>
</head>
