<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page introuvable — La Marmite Express</title>
<meta name="description" content="Cette page n'existe pas — La Marmite Express">
<meta property="og:title" content="Page introuvable — La Marmite Express">
<meta property="og:image" content="icon-512.png">
<meta name="theme-color" content="#f5a623">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design-system.css">
<link rel="stylesheet" href="assets/css/components.css">
<script src="assets/js/theme.js"></script>

<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:32px 20px;text-align:center}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(ellipse 80% 50% at 20% 10%,rgba(245,166,35,.05) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 80%,rgba(232,64,64,.04) 0%,transparent 60%);
  pointer-events:none}
.code{font-family:var(--font-title);font-size:clamp(80px,20vw,180px);line-height:1;letter-spacing:4px;color:var(--accent);margin-bottom:16px;text-shadow:0 0 60px rgba(245,166,35,.3)}
h1{font-family:var(--font-title);font-size:clamp(28px,5vw,42px);letter-spacing:2px;margin-bottom:8px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:var(--fs-base);margin-bottom:32px;max-width:420px;line-height:1.6}
.actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}
.actions .btn{width:100%}
.foot{margin-top:48px;font-size:var(--fs-xs);color:var(--muted-2);letter-spacing:.4px}
.foot a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="code">404</div>
<h1>Page <span>introuvable</span></h1>
<p class="sub">Cette page n'existe pas ou a été déplacée. Vérifiez l'URL ou retournez à l'accueil.</p>

<div class="actions">
  <a href="index.html" class="btn btn-primary btn-title btn-block">← Accueil</a>
  <a href="javascript:history.back()" class="btn btn-secondary btn-block">Page précédente</a>
</div>

<div class="foot">
  La <span style="color:var(--accent);font-weight:700">Marmite</span> Express ·
  <a href="https://github.com/Faresclt/marmitte-express">GitHub</a>
</div>
</body>
</html>
